name: Patch V51 connexion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'V51 - connexion bouton')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch connexion
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <button class="primary" onclick="signIn()">\n      Se connecter\n    </button>'''
          new = '''    <button id="signInBtn" type="button" class="primary" onclick="signIn()">\n      Se connecter\n    </button>'''
          if old not in s:
              raise SystemExit('bouton connexion introuvable')
          s = s.replace(old, new, 1)
          anchor = '''  /* ============================================================\n     INSCRIPTION\n     ============================================================ */'''
          listener = '''  /* V51 : le clic est aussi branché en JavaScript, sans dépendre de l'attribut inline. */\n  document.addEventListener("DOMContentLoaded", function() {\n    const btn = document.getElementById("signInBtn");\n    const status = document.getElementById("loginStatus");\n    if (!btn || !status) return;\n    btn.addEventListener("click", function(event) {\n      event.preventDefault();\n      status.className = "";\n      status.textContent = "Connexion en cours…";\n      Promise.resolve(signIn()).catch(function(error) {\n        console.error("Erreur clic connexion", error);\n        status.className = "error";\n        status.textContent = "Erreur : " + (error?.message || error);\n      });\n    });\n  });\n\n\n'''
          if anchor not in s:
              raise SystemExit('ancre inscription introuvable')
          if 'V51 : le clic est aussi branché' not in s:
              s = s.replace(anchor, listener + anchor, 1)
          s = s.replace('<!-- V50 -->', '<!-- V50 -->')
          s = s.replace('<div class="app-version-v18">V50</div>', '<div class="app-version-v18">V51</div>')
          s = s.replace('// V50 : correction de la connexion Supabase avec initialisation différée.', '// V51 : correction de la connexion Supabase avec initialisation différée + écoute directe du bouton.')
          if '<div class="app-version-v18">V51</div>' not in s:
              raise SystemExit('marqueur V51 manquant')
          if 'id="signInBtn"' not in s:
              raise SystemExit('id signInBtn manquant')
          if 'document.addEventListener("DOMContentLoaded"' not in s:
              raise SystemExit('listener manquant')
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          let re=/<script[^>]*>([\\s\\S]*?)<\\/script>/gi,m,n=0;
          while(m=re.exec(s)){ new Function(m[1]); n++; }
          if(!s.includes('<div class="app-version-v18">V51</div>')) throw new Error('V51 absent');
          if(!s.includes('id="signInBtn"')) throw new Error('bouton absent');
          if(!s.includes('V51 : le clic est aussi branché')) throw new Error('listener absent');
          console.log('OK JS blocks:', n);
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V51 - connexion bouton'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-v51.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary V51 workflow'
          git push
