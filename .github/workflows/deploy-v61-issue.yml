name: Deploy V61 from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: contains(github.event.issue.title, 'DEPLOY V61')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V61
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # ----- Version -----
          if '>V61</div>' not in s:
              m=re.search(r'>V(?:59|60)</div>',s)
              if not m: raise SystemExit('Version badge not found')
              s=s[:m.start()]+'>V61</div>'+s[m.end():]

          # ----- V60 score summary -----
          marker='        <div id="chartStatus" class="empty hidden">Aucun score enregistré sur cette période — le graphique se remplira au fur et à mesure.</div>'
          summary='''        <div id="scoreEvolutionSummary" class="score-evolution-summary" aria-live="polite">
          <div class="score-summary-item"><span class="score-summary-label">Progression depuis J1</span><strong id="scoreSummaryProgression">—</strong></div>
          <div class="score-summary-item"><span class="score-summary-label">Dimension la plus forte</span><strong id="scoreSummaryStrongest">—</strong></div>
          <div class="score-summary-item"><span class="score-summary-label">Dimension à travailler</span><strong id="scoreSummaryWeakest">—</strong></div>
          <p id="scoreSummaryContext" class="score-summary-context">Les indicateurs portent sur la période affichée.</p>
        </div>'''
          if 'id="scoreEvolutionSummary"' not in s:
              if marker not in s: raise SystemExit('Chart status marker not found')
              s=s.replace(marker, marker+'\n'+summary, 1)

          if 'id="v60-evolution-summary"' not in s:
              css='''<style id="v60-evolution-summary">
.score-evolution-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.score-summary-item{background:#f7f5f1;border:1px solid #ddd9d1;border-radius:10px;padding:12px;min-width:0}
.score-summary-label{display:block;color:#777;font-size:12px;margin-bottom:4px}
.score-summary-item strong{display:block;font-size:16px;line-height:1.3}
.score-summary-context{grid-column:1/-1;margin:0;color:#777;font-size:12px}
@media (max-width:700px){.score-evolution-summary{grid-template-columns:1fr}.score-summary-context{grid-column:auto}}
</style>\n'''
              s=s.replace('</head>',css+'</head>',1)

          if 'function renderScoreEvolutionSummary()' not in s:
              js='''
  function renderScoreEvolutionSummary() {
    const progressEl=document.getElementById("scoreSummaryProgression");
    const strongestEl=document.getElementById("scoreSummaryStrongest");
    const weakestEl=document.getElementById("scoreSummaryWeakest");
    const contextEl=document.getElementById("scoreSummaryContext");
    if(!progressEl||!strongestEl||!weakestEl)return;
    const endDay=Math.min(chartRange,91);
    const rows=(dailyScoreHistory||[]).filter(r=>{const d=Number(r.day_number);return Number.isFinite(d)&&d>=1&&d<=endDay}).sort((a,b)=>Number(a.day_number)-Number(b.day_number));
    const dims=[["presence","Présence"],["impulse_control","Maîtrise de l’impulsion"],["values_coherence","Cohérence avec mes valeurs"],["self_relation","Relation à moi-même"]];
    const valid=v=>{const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=10?n:null};
    const avg=r=>{const v=dims.map(([k])=>valid(r?.[k])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const scored=rows.filter(r=>avg(r)!==null);
    if(!scored.length){progressEl.textContent="—";strongestEl.textContent="—";weakestEl.textContent="—";if(contextEl)contextEl.textContent="Aucun score enregistré sur la période affichée.";return}
    const delta=avg(scored[scored.length-1])-avg(scored[0]);
    progressEl.textContent=(delta>=0?"+":"")+delta.toFixed(1)+" point"+(Math.abs(delta)>=2?"s":"");
    const avgs=dims.map(([k,label])=>{const v=rows.map(r=>valid(r?.[k])).filter(x=>x!==null);return {label,average:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}).filter(x=>x.average!==null).sort((a,b)=>b.average-a.average);
    strongestEl.textContent=avgs[0]?avgs[0].label+" · "+avgs[0].average.toFixed(1)+"/10":"—";
    weakestEl.textContent=avgs.length?avgs[avgs.length-1].label+" · "+avgs[avgs.length-1].average.toFixed(1)+"/10":"—";
    if(contextEl)contextEl.textContent="Comparaison du premier score enregistré (J"+Number(scored[0].day_number)+") au dernier (J"+Number(scored[scored.length-1].day_number)+"). Les deux autres indicateurs sont calculés sur la période affichée.";
  }
'''
              ins='\n  /* ============================================================\n     FORMATAGE PROGRAMME'
              if ins not in s: raise SystemExit('summary insertion marker missing')
              s=s.replace(ins,js+ins,1)

          if 'renderScoreEvolutionSummary();' not in s:
              end='    if (status) { status.textContent = ""; status.classList.add("hidden"); }\n  }\n\n  /* ============================================================\n     FORMATAGE PROGRAMME'
              if end not in s: raise SystemExit('summary call marker missing')
              s=s.replace(end,'    if (status) { status.textContent = ""; status.classList.add("hidden"); }\n    renderScoreEvolutionSummary();\n  }\n\n  /* ============================================================\n     FORMATAGE PROGRAMME',1)

          # ----- V61 dashboard styles -----
          if 'id="v61-dashboard-style"' not in s:
              css2=r'''\n<style id="v61-dashboard-style">\n.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}\n.dashboard-stat{background:#f7f5f1;border:1px solid #ddd9d1;border-radius:12px;padding:14px;min-width:0}\n.dashboard-stat-label{display:block;color:#777;font-size:12px;margin-bottom:5px}\n.dashboard-stat-value{display:block;font-size:24px;font-weight:700;line-height:1.15}\n.dashboard-stat-note{display:block;color:#777;font-size:12px;margin-top:5px}\n.dashboard-insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}\n.dashboard-insight{background:white;border:1px solid #e1ddd6;border-radius:12px;padding:14px}\n.dashboard-insight h3{margin:0 0 6px;font-size:16px}\n.dashboard-insight p{margin:0;color:#444}\n.dashboard-progress{height:10px;background:#e6e2db;border-radius:999px;overflow:hidden;margin-top:10px}\n.dashboard-progress > span{display:block;height:100%;background:#333;border-radius:999px;width:0;transition:width .25s ease}\n.dashboard-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee9e3;font-size:12px;color:#555}\n@media (max-width:700px){.dashboard-grid{grid-template-columns:1fr 1fr}.dashboard-insight-grid{grid-template-columns:1fr}}\n@media (max-width:480px){.dashboard-grid{grid-template-columns:1fr}}\n</style>\n'''
              s=s.replace('</head>',css2+'</head>',1)

          # ----- V61 runtime dashboard -----
          if 'id="v61-dashboard-runtime"' not in s:
              runtime=r'''\n<script id="v61-dashboard-runtime">\n(function(){\n  const oldShowSection=window.showSection;\n  let entries=[];\n  let ready=false;\n  function valid(v){const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=10?n:null}\n  function avg(r){const v=[r?.presence,r?.impulse_control,r?.values_coherence,r?.self_relation].map(valid).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}\n  function sorted(){return [...entries].sort((a,b)=>Number(a.day_number)-Number(b.day_number))}\n  function scored(){return sorted().filter(r=>avg(r)!==null)}\n  function streak(){const days=new Set(sorted().map(r=>Number(r.day_number)));let latest=0;days.forEach(d=>{if(d>latest)latest=d});if(!latest)return 0;let n=0;for(let d=latest;days.has(d);d--)n++;return n}\n  function make(){\n    const app=document.getElementById('app'), top=app?.querySelector('.topbar');\n    if(!app||!top||document.getElementById('v61Dashboard'))return;\n    const nav=top.querySelector('.nav-buttons');\n    if(nav&&!document.getElementById('dashboardNavButton')){const b=document.createElement('button');b.id='dashboardNavButton';b.className='secondary';b.type='button';b.textContent='🏠 Tableau de bord';b.onclick=()=>window.showSection('dashboard');nav.insertBefore(b,nav.firstChild)}\n    const sec=document.createElement('div');sec.id='v61Dashboard';sec.className='hidden';\n    sec.innerHTML=`<div class="card"><h2 class="section-title">🏠 Mon tableau de bord</h2><p id="v61WelcomeLine">Ton parcours en un coup d’œil.</p><div class="dashboard-progress"><span id="v61ProgressBar"></span></div><div class="dashboard-grid"><div class="dashboard-stat"><span class="dashboard-stat-label">Progression</span><strong id="v61Progress" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">jours du programme</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Score global</span><strong id="v61Score" class="dashboard-stat-value">—</strong><span id="v61ScoreNote" class="dashboard-stat-note">sur 10</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Streak</span><strong id="v61Streak" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">jours consécutifs sauvegardés</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Dernière journée</span><strong id="v61LastDay" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">dernière journée avec score</span></div></div></div><div class="card"><h2 class="section-title">🧠 Analyse de mon évolution</h2><div class="dashboard-insight-grid"><div class="dashboard-insight"><h3>📈 Progression depuis J1</h3><p id="v61Delta">—</p></div><div class="dashboard-insight"><h3>💪 Dimension qui progresse le plus</h3><p id="v61Strongest">—</p></div><div class="dashboard-insight"><h3>🎯 Dimension à surveiller</h3><p id="v61Weakest">—</p></div><div class="dashboard-insight"><h3>🔎 Lecture récente</h3><p id="v61Recent">—</p></div></div></div><div class="card"><h2 class="section-title">🗓️ Mes dernières journées</h2><div id="v61RecentList">—</div></div>`;\n    top.insertAdjacentElement('afterend',sec);ready=true;\n  }\n  async function load(){\n    try{const c=typeof getSupabaseClient==='function'?getSupabaseClient():null;if(!c)return;const {data:{user}}=await c.auth.getUser();if(!user)return;const {data,error}=await c.from('daily_entries').select('day_number,presence,impulse_control,values_coherence,self_relation').eq('user_id',user.id).order('day_number',{ascending:true});if(!error)entries=data||[]}catch(e){console.warn('V61 dashboard',e)}\n    render();\n  }\n  function render(){\n    make();if(!ready)return;const rows=sorted(), sc=scored(), first=sc[0], last=sc[sc.length-1];const p=last?Number(last.day_number):(typeof currentDay!=='undefined'?Number(currentDay):1);\n    document.getElementById('v61Progress').textContent=Math.max(0,Math.min(91,p))+'/91';document.getElementById('v61ProgressBar').style.width=((Math.max(0,Math.min(91,p))/91)*100)+'%';document.getElementById('v61Score').textContent=last?avg(last).toFixed(1)+'/10':'—';document.getElementById('v61ScoreNote').textContent=last?'J'+Number(last.day_number):'aucun score enregistré';document.getElementById('v61Streak').textContent=streak();document.getElementById('v61LastDay').textContent=last?'J'+Number(last.day_number):'—';document.getElementById('v61WelcomeLine').textContent='Jour '+(typeof currentDay!=='undefined'?currentDay:'1')+' — garde le cap, observe avant de juger.';\n    const dims=[['presence','Présence'],['impulse_control','Maîtrise de l’impulsion'],['values_coherence','Cohérence avec mes valeurs'],['self_relation','Relation à moi-même']];\n    document.getElementById('v61Delta').textContent=first&&last?((avg(last)-avg(first)>=0?'+':'')+(avg(last)-avg(first)).toFixed(1)+' point'+(Math.abs(avg(last)-avg(first))>=2?'s':'')+' entre J'+Number(first.day_number)+' et J'+Number(last.day_number)+'.'):'Il faut au moins deux journées notées pour mesurer une progression.';\n    const changes=dims.map(([k,label])=>{const a=sc.filter(r=>valid(r[k])!==null);if(!a.length)return{label,delta:null};return{label,delta:valid(a[a.length-1][k])-valid(a[0][k])}}).filter(x=>x.delta!==null).sort((a,b)=>b.delta-a.delta);\n    document.getElementById('v61Strongest').textContent=changes[0]?changes[0].label+' ('+(changes[0].delta>=0?'+':'')+changes[0].delta.toFixed(1)+')':'—';\n    const recent=sc.slice(-7);const low=dims.map(([k,label])=>{const v=recent.map(r=>valid(r[k])).filter(x=>x!==null);return{label,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}).filter(x=>x.avg!==null).sort((a,b)=>a.avg-b.avg);document.getElementById('v61Weakest').textContent=low[0]?low[0].label+' · '+low[0].avg.toFixed(1)+'/10 sur les 7 derniers scores':'—';\n    if(sc.length>=2){const ra=recent.length?recent.map(avg).reduce((a,b)=>a+b,0)/recent.length:null;const ga=sc.map(avg).reduce((a,b)=>a+b,0)/sc.length;document.getElementById('v61Recent').textContent=ra!==null?'Moyenne des 7 derniers scores : '+ra.toFixed(1)+'/10 (ensemble du parcours : '+ga.toFixed(1)+').':'—'}else document.getElementById('v61Recent').textContent='Continue à renseigner tes journées : l’analyse deviendra plus pertinente avec le temps.';\n    document.getElementById('v61RecentList').innerHTML=rows.slice(-5).reverse().map(r=>'<div class="dashboard-insight" style="margin-top:8px"><span class="dashboard-badge">J'+Number(r.day_number)+'</span> <strong>'+(avg(r)!==null?avg(r).toFixed(1)+'/10':'sans score')+'</strong></div>').join('')||'<div class="empty">Aucune journée sauvegardée pour le moment.</div>';\n  }\n  window.showSection=function(section){make();const d=document.getElementById('v61Dashboard'),db=document.getElementById('dashboardNavButton');if(section==='dashboard'){['programSection','journalSection','evolutionSection'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));document.querySelectorAll('.nav-buttons button').forEach(b=>b.classList.remove('nav-active'));d?.classList.remove('hidden');db?.classList.add('nav-active');render();return}d?.classList.add('hidden');db?.classList.remove('nav-active');if(typeof oldShowSection==='function')oldShowSection(section)};\n  window.addEventListener('load',()=>setTimeout(load,700));\n  if(typeof loadScoreHistory==='function'){const oldLoad=window.loadScoreHistory;window.loadScoreHistory=async function(){const r=await oldLoad.apply(this,arguments);setTimeout(load,150);return r}}\n})();\n</script>\n'''
              s=s.replace('</body>',runtime+'</body>',1)

          checks=['>V61</div>','id="scoreEvolutionSummary"','function renderScoreEvolutionSummary()','renderScoreEvolutionSummary();','id="v61-dashboard-style"','id="v61-dashboard-runtime"','id="v61Dashboard"','id="dashboardNavButton"','function v61Render']
          for c in checks:
              if c not in s: raise SystemExit('Missing V61 content: '+c)
          if s.count('>V61</div>')!=1: raise SystemExit('V61 badge count invalid')
          if s.count('id="v61-dashboard-runtime"')!=1: raise SystemExit('V61 runtime duplicate')
          if s.count('id="scoreEvolutionSummary"')!=1: raise SystemExit('summary duplicate')
          p.write_text(s,encoding='utf-8')

      - name: Validate and commit
        run: |
          grep -q '>V61</div>' index.html
          grep -q 'id="scoreEvolutionSummary"' index.html
          grep -q 'function renderScoreEvolutionSummary()' index.html
          grep -q 'renderScoreEvolutionSummary();' index.html
          grep -q 'id="v61-dashboard-style"' index.html
          grep -q 'id="v61-dashboard-runtime"' index.html
          grep -q 'id="v61Dashboard"' index.html
          grep -q 'id="dashboardNavButton"' index.html
          grep -q '__CONTROL_TABLE_JSON__' index.html
          grep -q '__FIN_TABLEAU_CONTROLE__' index.html
          test "$(grep -o 'id=\"v61-dashboard-runtime\"' index.html | wc -l)" -eq 1
          test "$(grep -o '>V61</div>' index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"scoreEvolutionSummary\"' index.html | wc -l)" -eq 1

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update index.html V61 - dashboard and analysis'
          git push

      - name: Close deployment issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment 'V61 déployée et vérifiée par le workflow.'
