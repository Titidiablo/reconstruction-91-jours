name: Deploy V59 migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V59 navigation dédiée aux scores
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '>V59</div>' in s and 'id="evolutionSection"' in s and 'id="evolutionNavButton"' in s:
              print('V59 already present')
              raise SystemExit(0)

          if '>V58</div>' not in s:
              raise SystemExit('V58 badge not found')
          s = s.replace('>V58</div>', '>V59</div>', 1)

          nav_anchor = '''        <button
          id="journalNavButton"
          class="secondary"
          onclick="showSection('journal')">
          📔 Mon journal intime
        </button>'''
          nav_new = nav_anchor + '''

        <button
          id="evolutionNavButton"
          class="secondary"
          onclick="showSection('evolution')">
          📈 Évolution des scores
        </button>'''
          if 'id="evolutionNavButton"' not in s:
              if nav_anchor not in s:
                  raise SystemExit('Navigation anchor not found')
              s = s.replace(nav_anchor, nav_new, 1)

          chart_start = s.find('      <!-- Évolution des scores -->')
          chart_end = s.find('      <!-- Contenu du jour -->', chart_start)
          if chart_start >= 0 and chart_end > chart_start:
              s = s[:chart_start] + s[chart_end:]

          if 'id="evolutionSection"' not in s:
              evolution_section = '''    <!-- ======================================================= -->
    <!-- ÉVOLUTION DES SCORES -->
    <!-- ======================================================= -->

    <div id="evolutionSection" class="hidden">

      <div class="card">
        <h2 class="section-title">📈 Évolution de mes scores</h2>
        <p>Visualise ma progression au fil des 91 jours.</p>
      </div>

      <div class="card score-chart-card">
        <div class="score-chart-toolbar">
          <button id="chart7Button" class="secondary" onclick="setChartRange(7)">7 jours</button>
          <button id="chart15Button" class="secondary" onclick="setChartRange(15)">15 jours</button>
          <button id="chart30Button" class="secondary" onclick="setChartRange(30)">30 jours</button>
          <button id="chart45Button" class="secondary" onclick="setChartRange(45)">45 jours</button>
          <button id="chart60Button" class="secondary" onclick="setChartRange(60)">60 jours</button>
          <button id="chart75Button" class="secondary" onclick="setChartRange(75)">75 jours</button>
          <button id="chart90Button" class="secondary active" onclick="setChartRange(90)">90 jours</button>
        </div>
        <div class="score-chart-wrap">
          <div id="scoreEvolutionChartContainer" aria-label="Graphique d’évolution des scores"></div>
        </div>
        <div id="chartStatus" class="empty hidden">Aucun score enregistré sur cette période — le graphique se remplira au fur et à mesure.</div>
      </div>

    </div>

'''
              close_anchor = '''    </div>

  </div>


<script>'''
              if close_anchor not in s:
                  raise SystemExit('Application closing anchor not found')
              s = s.replace(close_anchor, evolution_section + close_anchor, 1)

          pattern = re.compile(r'  function showSection\(section\) \{.*?\n  \}\n\n\n  /\* ============================================================\n     SELECTEUR', re.S)
          new_show = '''  function showSection(section) {

    const program = document.getElementById("programSection");
    const journal = document.getElementById("journalSection");
    const evolution = document.getElementById("evolutionSection");

    const programButton = document.getElementById("programNavButton");
    const journalButton = document.getElementById("journalNavButton");
    const evolutionButton = document.getElementById("evolutionNavButton");

    [program, journal, evolution].forEach(el => {
      if (el) el.classList.add("hidden");
    });

    [programButton, journalButton, evolutionButton].forEach(btn => {
      if (btn) btn.classList.remove("nav-active");
    });

    if (section === "journal") {
      journal.classList.remove("hidden");
      journalButton.classList.add("nav-active");
      loadJournalEntries();
      return;
    }

    if (section === "evolution") {
      evolution.classList.remove("hidden");
      evolutionButton.classList.add("nav-active");
      renderScoreEvolutionChart();
      return;
    }

    program.classList.remove("hidden");
    programButton.classList.add("nav-active");
  }


  /* ============================================================
     SELECTEUR'''
          s, n = pattern.subn(new_show, s, count=1)
          if n != 1:
              raise SystemExit('showSection function not found')

          old_toggle = '''  function toggleScoreEvolution() {
    const body = document.getElementById("scoreEvolutionBody");
    const button = document.getElementById("scoreEvolutionToggle");
    if (!body || !button) return;

    const collapsed = body.classList.toggle("collapsed");
    button.textContent = collapsed ? "▶" : "▼";
    button.setAttribute("aria-expanded", String(!collapsed));

    if (!collapsed && scoreEvolutionChart) {
      setTimeout(() => scoreEvolutionChart.resize(), 50);
    }
  }

'''
          s = s.replace(old_toggle, '', 1)

          required = [
              '>V59</div>',
              'id="evolutionNavButton"',
              'onclick="showSection(\'evolution\')"',
              'id="evolutionSection"',
              'if (section === "evolution")',
              'id="scoreEvolutionChartContainer"',
              'id="chart90Button"'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Missing V59 element: ' + item)

          prog = s[s.index('<div id="programSection">'):s.index('<div id="journalSection"')]
          if 'scoreEvolutionChartContainer' in prog:
              raise SystemExit('Chart still present in programSection')
          if 'id="scoreEvolutionBody"' in s or 'scoreEvolutionToggle' in s:
              raise SystemExit('Old collapsible chart markup still present')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify V59 before commit
        shell: bash
        run: |
          grep -q '>V59</div>' index.html
          grep -q 'id="evolutionNavButton"' index.html
          grep -q 'id="evolutionSection"' index.html
          grep -q 'if (section === "evolution")' index.html
          grep -q 'id="scoreEvolutionChartContainer"' index.html
          grep -q 'id="chart90Button"' index.html
          ! grep -q 'id="scoreEvolutionBody"' index.html
          ! grep -q 'scoreEvolutionToggle' index.html

      - name: Commit V59
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V59 - dedicated score evolution page'
          git push
