name: Deploy V50 direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, 'V50 direct patch completed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: file } = await github.rest.repos.getContent({owner, repo, path: 'index.html', ref: 'main'});
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            if (!s.includes('<div class="app-version-v18">V49</div>')) throw new Error('V49 source attendu introuvable');

            const old = `      if (!supabaseClient) {\n        throw new Error("Le client Supabase n'est pas initialisé.");\n      }\n\n`;
            const replacement = `      // getSupabaseClient() initialise le client à la demande.\n\n`;
            if (!s.includes(old)) throw new Error('garde supabaseClient introuvable');
            s = s.replace(old, replacement);
            s = s.replace('// V49 : initialisation Supabase différée pour que le bouton de connexion reste fonctionnel.', '// V50 : correction de la connexion Supabase avec initialisation différée.');
            s = s.replace('<div class="app-version-v18">V49</div>', '<div class="app-version-v18">V50</div>');
            if (!s.includes('<div class="app-version-v18">V50</div>')) throw new Error('V50 marker missing');
            if (!s.includes('getSupabaseClient().auth.signInWithPassword')) throw new Error('signIn Supabase missing');
            if (s.includes('Le client Supabase n\'est pas initialisé.')) throw new Error('ancienne garde encore présente');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path: 'index.html', message: 'V50 direct patch completed', content: Buffer.from(s, 'utf8').toString('base64'), sha: file.sha, branch: 'main'});
            core.info('index.html V50 déployé');
