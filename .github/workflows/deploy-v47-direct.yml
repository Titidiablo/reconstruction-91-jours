name: Deploy V49 direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, 'V49 - corriger initialisation Supabase')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: file } = await github.rest.repos.getContent({owner, repo, path: 'index.html', ref: 'main'});
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            if (!s.includes('<div class="app-version-v18">V48</div>')) throw new Error('V48 source attendu introuvable');

            const oldClient = `  const supabaseClient =\n    window.supabase.createClient(\n      SUPABASE_URL,\n      SUPABASE_KEY\n    );\n`;
            const newClient = `  let supabaseClient = null;\n\n  function getSupabaseClient() {\n    if (!window.supabase || !window.supabase.createClient) {\n      throw new Error("La bibliothèque Supabase n'est pas chargée. Recharge la page avec Ctrl+F5.");\n    }\n    if (!supabaseClient) {\n      supabaseClient = window.supabase.createClient(\n        SUPABASE_URL,\n        SUPABASE_KEY\n      );\n    }\n    return supabaseClient;\n  }\n`;
            if (!s.includes(oldClient)) throw new Error('initialisation Supabase cible introuvable');
            s = s.replace(oldClient, newClient);

            const oldSignUp = `      await supabaseClient.auth.signUp({\n        email: email,\n        password: password\n      });`;
            const newSignUp = `      await getSupabaseClient().auth.signUp({\n        email: email,\n        password: password\n      });`;
            if (!s.includes(oldSignUp)) throw new Error('signUp cible introuvable');
            s = s.replace(oldSignUp, newSignUp);

            const oldSignIn = `        await supabaseClient.auth.signInWithPassword({\n          email: email,\n          password: password\n        });`;
            const newSignIn = `        await getSupabaseClient().auth.signInWithPassword({\n          email: email,\n          password: password\n        });`;
            if (!s.includes(oldSignIn)) throw new Error('signIn cible introuvable');
            s = s.replace(oldSignIn, newSignIn);

            s = s.replace('  // V48 : toute modification de formulaire rend la journée "sale".', '  // V49 : initialisation Supabase différée pour que le bouton de connexion reste fonctionnel.');
            s = s.replace('<div class="app-version-v18">V48</div>', '<div class="app-version-v18">V49</div>');
            if (!s.includes('<div class="app-version-v18">V49</div>')) throw new Error('V49 marker missing');
            if (!s.includes('function getSupabaseClient()')) throw new Error('getSupabaseClient missing');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path: 'index.html', message: 'V49 - corriger initialisation Supabase', content: Buffer.from(s, 'utf8').toString('base64'), sha: file.sha, branch: 'main'});
            core.info('index.html V49 déployé');
