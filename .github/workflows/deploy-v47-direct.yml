name: Deploy V47 direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, 'V47 - corriger restauration du tableau Supabase')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: file } = await github.rest.repos.getContent({owner, repo, path: 'index.html', ref: 'main'});
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            if (s.includes('<div class="app-version-v18">V47</div>') && s.includes('const rawExerciseResponse = data.exercise_response || "";') && s.includes('const jsonPos = raw.lastIndexOf(jsonMarker);')) {
              core.info('index.html est déjà en V47');
              return;
            }
            const oldLoad = `    document.getElementById("exerciseResponse").value =\n      data.exercise_response || "";\n`;
            const newLoad = `    const rawExerciseResponse = data.exercise_response || "";\n    // Ne jamais transporter les anciens blocs structurés dans le champ caché :\n    // sinon chaque sauvegarde les concatène à nouveau.\n    const hasStructuredBlocks = /(?:^|\\n)(?:PRATIQUE DU JOUR|TRACE ÉCRITE|TABLEAU CONTRÔLE \/ INFLUENCE \/ HORS CONTRÔLE|DÉCISION SANS VALIDATION|BILAN DE SEMAINE — SCORES)\\n/i.test(rawExerciseResponse);\n    document.getElementById("exerciseResponse").value = hasStructuredBlocks ? "" : rawExerciseResponse;\n`;
            if (!s.includes(oldLoad)) throw new Error('loadExistingEntry target not found');
            s = s.replace(oldLoad, newLoad);
            const oldClear = `    ["practiceResponse","traceResponse","actionResponseInline","eveningResponseInline"].forEach(id => { const el=document.getElementById(id); if(el) el.value=""; });\n\n    document.getElementById("saveStatus").textContent = "";\n`;
            const newClear = `    ["practiceResponse","traceResponse","actionResponseInline","eveningResponseInline"].forEach(id => { const el=document.getElementById(id); if(el) el.value=""; });\n\n    const body = document.getElementById("controlTableBody");\n    if (body) {\n      body.innerHTML = "";\n      for (let i = 0; i < 3; i++) addControlRow();\n    }\n\n    document.getElementById("saveStatus").textContent = "";\n`;
            if (!s.includes(oldClear)) throw new Error('clearProgramJournal target not found');
            s = s.replace(oldClear, newClear);
            const oldRestore = `    const marker = "TABLEAU CONTRÔLE / INFLUENCE / HORS CONTRÔLE";\n    const start = raw.indexOf(marker);\n\n    if (start < 0) {\n      for (let i = 0; i < 3; i++) addControlRow();\n      return;\n    }\n\n    let section = raw.slice(start + marker.length);\n    const endMarker = "\\n__FIN_TABLEAU_CONTROLE__";\n    const endPos = section.indexOf(endMarker);\n    if (endPos >= 0) section = section.slice(0, endPos).trim();\n\n    // Nouveau format : restauration EXACTE du tableau, y compris zéro ligne.\n    const jsonMarker = "__CONTROL_TABLE_JSON__";\n    const jsonPos = section.indexOf(jsonMarker);\n    if (jsonPos >= 0) {\n      const json = section.slice(jsonPos + jsonMarker.length).trim();\n      try {\n        const rows = JSON.parse(json);\n        if (Array.isArray(rows)) {\n          rows.slice(0, 15).forEach(values => {\n            if (Array.isArray(values)) addControlRow([values[0] || "", values[1] || "", values[2] || ""]);\n          });\n          return;\n        }\n      } catch (e) {\n        console.warn("Impossible de restaurer le tableau JSON", e);\n      }\n    }\n`;
            const newRestore = `    const marker = "TABLEAU CONTRÔLE / INFLUENCE / HORS CONTRÔLE";\n    const jsonMarker = "__CONTROL_TABLE_JSON__";\n    const endMarker = "\\n__FIN_TABLEAU_CONTROLE__";\n\n    // La BDD peut contenir des sauvegardes historiques concaténées :\n    // le dernier bloc JSON est le plus récent et devient la source de vérité.\n    const jsonPos = raw.lastIndexOf(jsonMarker);\n    if (jsonPos >= 0) {\n      const jsonEnd = raw.indexOf(endMarker, jsonPos);\n      const json = raw.slice(jsonPos + jsonMarker.length, jsonEnd >= 0 ? jsonEnd : raw.length).trim();\n      try {\n        const rows = JSON.parse(json);\n        if (Array.isArray(rows)) {\n          rows.slice(0, 15).forEach(values => {\n            if (Array.isArray(values)) addControlRow([values[0] || "", values[1] || "", values[2] || ""]);\n          });\n          return;\n        }\n      } catch (e) {\n        console.warn("Impossible de restaurer le dernier tableau JSON", e);\n      }\n    }\n\n    // Compatibilité avec les anciennes sauvegardes sans JSON : dernier bloc.\n    const start = raw.lastIndexOf(marker);\n    if (start < 0) {\n      for (let i = 0; i < 3; i++) addControlRow();\n      return;\n    }\n\n    let section = raw.slice(start + marker.length);\n    const endPos = section.indexOf(endMarker);\n    if (endPos >= 0) section = section.slice(0, endPos).trim();\n`;
            if (!s.includes(oldRestore)) throw new Error('restoreControlTable target not found');
            s = s.replace(oldRestore, newRestore);
            s = s.replace('/* V45 - protection contre les changements de jour avec modifications non sauvegardées */', '/* V47 - restauration du tableau depuis la BDD, sans écrasement local */');
            s = s.replace('<div class="app-version-v18">V45</div>', '<div class="app-version-v18">V47</div>');
            s = s.replace('// V45 : toute modification de formulaire rend la journée "sale".', '// V47 : toute modification de formulaire rend la journée "sale".');
            if (!s.includes('<div class="app-version-v18">V47</div>')) throw new Error('V47 marker missing');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path: 'index.html', message: 'V47 - corriger restauration du tableau Supabase', content: Buffer.from(s, 'utf8').toString('base64'), sha: file.sha, branch: 'main'});
            core.info('index.html V47 déployé');
