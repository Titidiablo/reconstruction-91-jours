name: Deploy V56 final

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '>V56</div>' in s:
              print('V56 already present')
              raise SystemExit(0)
          if '>V55</div>' not in s:
              raise SystemExit('V55 badge not found')

          s = s.replace('>V55</div>', '>V56</div>', 1)

          old_toolbar = '''<div class="score-chart-toolbar">
          <button id="chart7Button" class="secondary" onclick="setChartRange(7)">7 derniers jours</button>
          <button id="chart30Button" class="secondary" onclick="setChartRange(30)">30 derniers jours</button>
          <button id="chart90Button" class="secondary active" onclick="setChartRange(90)">90 derniers jours</button>
        </div>'''
          new_toolbar = '''<div class="score-chart-toolbar">
          <button id="chart7Button" class="secondary" onclick="setChartRange(7)">7 jours</button>
          <button id="chart15Button" class="secondary" onclick="setChartRange(15)">15 jours</button>
          <button id="chart30Button" class="secondary" onclick="setChartRange(30)">30 jours</button>
          <button id="chart45Button" class="secondary" onclick="setChartRange(45)">45 jours</button>
          <button id="chart60Button" class="secondary" onclick="setChartRange(60)">60 jours</button>
          <button id="chart75Button" class="secondary" onclick="setChartRange(75)">75 jours</button>
          <button id="chart90Button" class="secondary active" onclick="setChartRange(90)">90 jours</button>
        </div>'''
          if old_toolbar not in s:
              raise SystemExit('Toolbar exact block not found')
          s = s.replace(old_toolbar, new_toolbar, 1)

          old_range = '''  function setChartRange(range) {
    chartRange = range;

    [7, 30, 90].forEach(r => {
      const button = document.getElementById("chart" + r + "Button");
      if (button) button.classList.toggle("active", r === range);
    });

    renderScoreEvolutionChart();
  }'''
          new_range = '''  function setChartRange(range) {
    chartRange = range;

    [7, 15, 30, 45, 60, 75, 90].forEach(r => {
      const button = document.getElementById("chart" + r + "Button");
      if (button) button.classList.toggle("active", r === range);
    });

    renderScoreEvolutionChart();
  }'''
          if old_range not in s:
              raise SystemExit('setChartRange exact block not found')
          s = s.replace(old_range, new_range, 1)

          old_calc = '''    const endDay = Number(currentDay) || 1;

    // Le graphique est également visible au Jour 1.
    // La période commence simplement à J1 lorsqu'il n'existe pas encore de jours précédents.
    const startDay = Math.max(1, endDay - chartRange + 1);
    const rows = (dailyScoreHistory || [])
      .filter(row => {
        const d = Number(row.day_number);
        return Number.isFinite(d) && d >= startDay && d <= endDay;
      })
      .sort((a,b) => Number(a.day_number) - Number(b.day_number));'''
          new_calc = '''    // Les boutons représentent les N premiers jours du programme.
    // Le jour courant n'influence jamais la période affichée.
    const startDay = 1;
    const endDay = Math.min(chartRange, 91);
    const rows = (dailyScoreHistory || [])
      .filter(row => {
        const d = Number(row.day_number);
        return Number.isFinite(d) && d >= startDay && d <= endDay;
      })
      .sort((a,b) => Number(a.day_number) - Number(b.day_number));'''
          if old_calc not in s:
              raise SystemExit('Chart calculation exact block not found')
          s = s.replace(old_calc, new_calc, 1)

          required = [
              '>V56</div>', 'id="chart7Button"', 'id="chart15Button"', 'id="chart30Button"',
              'id="chart45Button"', 'id="chart60Button"', 'id="chart75Button"', 'id="chart90Button"',
              '[7, 15, 30, 45, 60, 75, 90].forEach',
              'const startDay = 1;', 'const endDay = Math.min(chartRange, 91);',
              'Number.isFinite(value) ? Math.max(0, Math.min(10, value)) : 0'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Missing V56 content: ' + item)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q '>V56</div>' index.html
          grep -q 'id="chart15Button"' index.html
          grep -q 'id="chart45Button"' index.html
          grep -q 'id="chart60Button"' index.html
          grep -q 'id="chart75Button"' index.html
          grep -q 'const startDay = 1;' index.html
          grep -q 'const endDay = Math.min(chartRange, 91);' index.html
          grep -q 'Number.isFinite(value) ? Math.max(0, Math.min(10, value)) : 0' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update index.html V56'
          git push