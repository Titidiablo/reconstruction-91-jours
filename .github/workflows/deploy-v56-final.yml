name: Deploy V59 final

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply V59
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'index.html';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            let html = Buffer.from(current.data.content, 'base64').toString('utf8');

            if (html.includes('>V59</div>') && html.includes('id="evolutionSection"') && html.includes('id="evolutionNavButton"')) {
              core.info('V59 already installed.');
              return;
            }
            if (!html.includes('>V58</div>')) throw new Error('V58 badge not found');
            html = html.replace('>V58</div>', '>V59</div>', 1);

            const nav = `        <button\n          id="journalNavButton"\n          class="secondary"\n          onclick="showSection('journal')">\n          📔 Mon journal intime\n        </button>`;
            const navAdd = nav + `\n\n        <button\n          id="evolutionNavButton"\n          class="secondary"\n          onclick="showSection('evolution')">\n          📈 Évolution des scores\n        </button>`;
            if (!html.includes('id="evolutionNavButton"')) {
              if (!html.includes(nav)) throw new Error('Journal navigation button not found');
              html = html.replace(nav, navAdd, 1);
            }

            const chartStart = html.indexOf('      <!-- Évolution des scores -->');
            const chartEnd = html.indexOf('      <!-- Contenu du jour -->', chartStart);
            if (chartStart < 0 || chartEnd < 0) throw new Error('Program chart block not found');
            html = html.slice(0, chartStart) + html.slice(chartEnd);

            const evolution = `    <!-- ======================================================= -->\n    <!-- ÉVOLUTION DES SCORES -->\n    <!-- ======================================================= -->\n\n    <div id="evolutionSection" class="hidden">\n\n      <div class="card">\n        <h2 class="section-title">📈 Évolution de mes scores</h2>\n        <p>Visualise ma progression au fil des 91 jours.</p>\n      </div>\n\n      <div class="card score-chart-card">\n        <div class="score-chart-toolbar">\n          <button id="chart7Button" class="secondary" onclick="setChartRange(7)">7 jours</button>\n          <button id="chart15Button" class="secondary" onclick="setChartRange(15)">15 jours</button>\n          <button id="chart30Button" class="secondary" onclick="setChartRange(30)">30 jours</button>\n          <button id="chart45Button" class="secondary" onclick="setChartRange(45)">45 jours</button>\n          <button id="chart60Button" class="secondary" onclick="setChartRange(60)">60 jours</button>\n          <button id="chart75Button" class="secondary" onclick="setChartRange(75)">75 jours</button>\n          <button id="chart90Button" class="secondary active" onclick="setChartRange(90)">90 jours</button>\n        </div>\n        <div class="score-chart-wrap">\n          <div id="scoreEvolutionChartContainer" aria-label="Graphique d’évolution des scores"></div>\n        </div>\n        <div id="chartStatus" class="empty hidden">Aucun score enregistré sur cette période — le graphique se remplira au fur et à mesure.</div>\n      </div>\n\n    </div>\n\n`;
            const journalMarker = '    <!-- ======================================================= -->\n    <!-- JOURNAL INTIME -->';
            if (!html.includes('id="evolutionSection"')) {
              if (!html.includes(journalMarker)) throw new Error('Journal section marker not found');
              html = html.replace(journalMarker, evolution + journalMarker, 1);
            }

            const start = html.indexOf('  function showSection(section) {');
            const end = html.indexOf('\n  /* ============================================================\n     SELECTEUR', start);
            if (start < 0 || end < 0) throw new Error('showSection boundaries not found');
            const newShow = `  function showSection(section) {\n\n    const program = document.getElementById("programSection");\n    const journal = document.getElementById("journalSection");\n    const evolution = document.getElementById("evolutionSection");\n\n    const programButton = document.getElementById("programNavButton");\n    const journalButton = document.getElementById("journalNavButton");\n    const evolutionButton = document.getElementById("evolutionNavButton");\n\n    [program, journal, evolution].forEach(el => { if (el) el.classList.add("hidden"); });\n    [programButton, journalButton, evolutionButton].forEach(btn => { if (btn) btn.classList.remove("nav-active"); });\n\n    if (section === "journal") {\n      journal.classList.remove("hidden");\n      journalButton.classList.add("nav-active");\n      loadJournalEntries();\n      return;\n    }\n\n    if (section === "evolution") {\n      evolution.classList.remove("hidden");\n      evolutionButton.classList.add("nav-active");\n      renderScoreEvolutionChart();\n      return;\n    }\n\n    program.classList.remove("hidden");\n    programButton.classList.add("nav-active");\n  }\n`;
            html = html.slice(0, start) + newShow + html.slice(end);

            const oldToggle = /  function toggleScoreEvolution\(\) \{[\s\S]*?\n  \}\n\n/;
            html = html.replace(oldToggle, '', 1);

            const checks = [
              '>V59</div>',
              'id="evolutionNavButton"',
              'id="evolutionSection"',
              'if (section === "evolution")',
              'id="scoreEvolutionChartContainer"',
              'const averageColor = "#f59e0b"',
              'chart-legend-dashed'
            ];
            for (const item of checks) if (!html.includes(item)) throw new Error('Missing V59 content: ' + item);
            const p0 = html.indexOf('<div id="programSection">');
            const e0 = html.indexOf('<div id="evolutionSection"');
            if (p0 < 0 || e0 < 0 || e0 <= p0) throw new Error('Program/Evolution sections invalid');
            const programPart = html.slice(p0, e0);
            if (programPart.includes('scoreEvolutionChartContainer') || programPart.includes('<!-- Évolution des scores -->')) throw new Error('Chart still in Program');
            if ((html.match(/id="scoreEvolutionChartContainer"/g)||[]).length !== 1) throw new Error('Chart container count invalid');

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'V59 - dedicated score evolution page',
              content: Buffer.from(html, 'utf8').toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            });
            core.info('V59 committed.');

      - name: Verify V59
        uses: actions/github-script@v7
        with:
          script: |
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: 'index.html', ref: 'main'});
            const html = Buffer.from(current.data.content, 'base64').toString('utf8');
            const checks = ['>V59</div>','id="evolutionNavButton"','id="evolutionSection"','if (section === "evolution")','id="scoreEvolutionChartContainer"','const averageColor = "#f59e0b"','chart-legend-dashed'];
            for (const item of checks) if (!html.includes(item)) throw new Error('Verification failed: ' + item);
            const p0 = html.indexOf('<div id="programSection">');
            const e0 = html.indexOf('<div id="evolutionSection"');
            if (html.slice(p0,e0).includes('scoreEvolutionChartContainer')) throw new Error('Chart remains in Program');
            core.info('V59 verified.');
