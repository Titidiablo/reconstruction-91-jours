name: Deploy V53

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-v53:
    if: !contains(github.event.head_commit.message, 'V53')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_marker = '/* V52 - base V45 + initialisation Supabase robuste */'
          new_marker = '/* V53 - boîte de dialogue fixe pour les modifications non sauvegardées */'
          if old_marker in s:
              s = s.replace(old_marker, new_marker, 1)
          elif 'V53 - boîte de dialogue fixe' not in s:
              raise SystemExit('V52 marker not found; refusing to patch unknown base')

          if '<div id="unsavedChangesModal"' not in s:
              raise SystemExit('Unsaved modal markup not found')

          css_anchor = '#scoreEvolutionChartContainer { width:100%; min-height:360px; }'
          css_patch = '''

/* V53 — message de modifications non sauvegardées en vraie boîte de dialogue */
.unsaved-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.55);
}

.unsaved-modal-backdrop.hidden {
  display: none !important;
}

.unsaved-modal {
  width: min(560px, 100%);
  background: #fff;
  border-radius: 16px;
  padding: 26px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.30);
  border: 1px solid rgba(0, 0, 0, 0.08);
  text-align: left;
  animation: unsavedModalIn 0.16s ease-out;
}

.unsaved-modal h3 {
  margin: 0 0 12px;
  font-size: 21px;
}

.unsaved-modal p {
  margin: 0 0 20px;
  color: #555;
  line-height: 1.5;
}

.unsaved-modal-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.unsaved-modal-actions button {
  width: 100%;
  margin: 0;
}

.unsaved-modal-actions .stay-btn {
  background: #f0eee9;
  color: #222;
  border: 1px solid #d6d2ca;
}

.unsaved-modal-actions .stay-btn:hover {
  background: #e8e5df;
}

@keyframes unsavedModalIn {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
'''
          if '.unsaved-modal-backdrop {' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css_patch, 1)

          # Ensure the version badge is updated as part of this release.
          if '>V52</div>' in s:
              s = s.replace('>V52</div>', '>V53</div>', 1)
          elif '>V53</div>' not in s:
              raise SystemExit('V52 version badge not found; refusing to patch unknown version')

          # Basic structural validation before commit.
          checks = [
              '>V53</div>',
              '.unsaved-modal-backdrop {',
              'position: fixed;',
              'z-index: 99999;',
              'align-items: center;',
              'justify-content: center;',
              'class="unsaved-modal"',
              'id="unsavedSaveBtn"',
              'id="unsavedCancelBtn"',
              'id="unsavedStayBtn"',
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit(f'Missing expected V53 content: {c}')

          p.write_text(s, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          grep -q '>V53</div>' index.html
          grep -q 'position: fixed;' index.html
          grep -q 'z-index: 99999;' index.html
          grep -q 'justify-content: center;' index.html
          grep -q 'id="unsavedStayBtn"' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          js_blocks = []
          for code in scripts:
              if code.strip():
                  js_blocks.append(code)
          for i, code in enumerate(js_blocks, 1):
              Path(f'/tmp/block_{i}.js').write_text(code, encoding='utf-8')
          print(f'Validated {len(js_blocks)} inline script block(s) structurally.')
          print('V53 version marker and modal CSS/HTML checks passed.')
          PY

      - name: Commit V53
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 0; } || true
          git commit -m "Update index.html V53"
          git push
