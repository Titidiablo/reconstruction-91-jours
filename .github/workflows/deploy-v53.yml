name: Deploy V53

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-v53:
    if: !contains(github.event.head_commit.message, 'V53')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<div id="unsavedChangesModal"' not in s:
              raise SystemExit('Unsaved modal markup not found')

          # Accept the currently deployed V51/V52 base and make this release V53.
          if '>V53</div>' not in s:
              m = re.search(r'>V5[12]</div>', s)
              if not m:
                  raise SystemExit('V51/V52 version badge not found; refusing to patch unknown base')
              s = s[:m.start()] + '>V53</div>' + s[m.end():]

          if '/* V53 — message de modifications non sauvegardées en vraie boîte de dialogue */' not in s:
              css_anchor = '#scoreEvolutionChartContainer { width:100%; min-height:360px; }'
              css_patch = '''

/* V53 — message de modifications non sauvegardées en vraie boîte de dialogue */
.unsaved-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.55);
}

.unsaved-modal-backdrop.hidden {
  display: none !important;
}

.unsaved-modal {
  width: min(560px, 100%);
  background: #fff;
  border-radius: 16px;
  padding: 26px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.30);
  border: 1px solid rgba(0, 0, 0, 0.08);
  text-align: left;
  animation: unsavedModalIn 0.16s ease-out;
}

.unsaved-modal h3 {
  margin: 0 0 12px;
  font-size: 21px;
}

.unsaved-modal p {
  margin: 0 0 20px;
  color: #555;
  line-height: 1.5;
}

.unsaved-modal-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.unsaved-modal-actions button {
  width: 100%;
  margin: 0;
}

.unsaved-modal-actions .stay-btn {
  background: #f0eee9;
  color: #222;
  border: 1px solid #d6d2ca;
}

.unsaved-modal-actions .stay-btn:hover {
  background: #e8e5df;
}

@keyframes unsavedModalIn {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
'''
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css_patch, 1)

          checks = [
              '>V53</div>',
              '.unsaved-modal-backdrop {',
              'position: fixed;',
              'z-index: 99999;',
              'align-items: center;',
              'justify-content: center;',
              'class="unsaved-modal"',
              'id="unsavedSaveBtn"',
              'id="unsavedCancelBtn"',
              'id="unsavedStayBtn"',
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit(f'Missing expected V53 content: {c}')

          p.write_text(s, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          grep -q '>V53</div>' index.html
          grep -q 'position: fixed;' index.html
          grep -q 'z-index: 99999;' index.html
          grep -q 'justify-content: center;' index.html
          grep -q 'id="unsavedStayBtn"' index.html
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="unsavedChangesModal"') == 1
          assert s.count('.unsaved-modal-backdrop {') == 1
          print('V53 validation passed.')
          PY

      - name: Commit V53
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Update index.html V53"
          git push
