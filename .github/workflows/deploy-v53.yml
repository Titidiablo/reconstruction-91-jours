name: Deploy V53

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          if git log -1 --pretty=%B | grep -q 'Update index.html V53'; then
            echo 'V53 already deployed.'
            exit 0
          fi
          grep -q '>V51</div>\|>V52</div>' index.html
          sed -i -E '0,/>V5[12]<\/div>/s//>V53<\/div>/' index.html
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); assert 'id=\"unsavedChangesModal\"' in s; css='''<style id=\"v53-unsaved-modal\">.unsaved-modal-backdrop{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}.unsaved-modal-backdrop.hidden{display:none!important}.unsaved-modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:26px;box-shadow:0 18px 60px rgba(0,0,0,.30);border:1px solid rgba(0,0,0,.08);text-align:left;animation:unsavedModalIn .16s ease-out}.unsaved-modal h3{margin:0 0 12px;font-size:21px}.unsaved-modal p{margin:0 0 20px;color:#555;line-height:1.5}.unsaved-modal-actions{display:flex;flex-direction:column;gap:9px}.unsaved-modal-actions button{width:100%;margin:0}.unsaved-modal-actions .stay-btn{background:#f0eee9;color:#222;border:1px solid #d6d2ca}.unsaved-modal-actions .stay-btn:hover{background:#e8e5df}@keyframes unsavedModalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}</style>'''; assert 'id=\"v53-unsaved-modal\"' not in s; s=s.replace('</head>',css+'\n</head>',1); p.write_text(s,encoding='utf-8')"

      - name: Validate and commit
        run: |
          grep -q '>V53</div>' index.html
          grep -q 'id="v53-unsaved-modal"' index.html
          grep -q 'position:fixed' index.html
          grep -q 'z-index:99999' index.html
          grep -q 'id="unsavedChangesModal"' index.html
          grep -q 'id="unsavedSaveBtn"' index.html
          grep -q 'id="unsavedCancelBtn"' index.html
          grep -q 'id="unsavedStayBtn"' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update index.html V53'
          git push
