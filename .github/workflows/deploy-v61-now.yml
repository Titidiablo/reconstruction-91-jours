name: Deploy V61 dashboard now

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply V61
        run: python3 scripts/deploy_v61.py

      - name: Commit V61
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "V61 déjà présent"
          else
            git commit -m "Update index.html V61 - dashboard and analysis"
            git push
          fi

      - name: Verify V61
        run: |
          grep -q '>V61</div>' index.html
          grep -q 'id="v61-dashboard-runtime"' index.html
          grep -q 'id="v61Dashboard"' index.html
          grep -q 'Progression depuis J1' index.html
