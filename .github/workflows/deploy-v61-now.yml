name: Deploy V61 dashboard now

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Apply V61
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}/contents/index.html?ref=main"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          html = base64.b64decode(data["content"]).decode("utf-8")

          if ">V61</div>" not in html:
              if ">V59</div>" not in html:
                  raise SystemExit("Version V59 introuvable")
              html = html.replace(">V59</div>", ">V61</div>", 1)

          css = base64.b64decode("PHN0eWxlIGlkPSJ2NjEtZGFzaGJvYXJkLXN0eWxlIj4KLnY2MS1kYXNoYm9hcmR7bWFyZ2luLXRvcDowfQp2NjEtcHJvZ3Jlc3N7aGVpZ2h0OjEwcHg7YmFja2dyb3VuZDojZTZlMmRiO2JvcmRlci1yYWRpdXM6OTk5cHg7b3ZlcmZsb3c6aGlkZGVuO21hcmdpbi10b3A6MTBweH0KLnY2MS1wcm9ncmVzcyBzcGFu{display:block;height:100%;width:0;background:#333;border-radius:999px;transition:width .25s ease}.v61-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.v61-stat{background:#f7f5f1;border:1px solid #ddd9d1;border-radius:12px;padding:14px}.v61-label{display:block;color:#777;font-size:12px;margin-bottom:5px}.v61-value{display:block;font-size:24px;font-weight:700;line-height:1.15}.v61-note{display:block;color:#777;font-size:12px;margin-top:5px}.v61-insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.v61-insight{background:#fff;border:1px solid #e1ddd6;border-radius:12px;padding:14px}.v61-insight h3{margin:0 0 6px;font-size:16px}.v61-insight p{margin:0;color:#444}.v61-day{display:flex;justify-content:space-between;align-items:center;border:1px solid #e1ddd6;border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}.v61-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee9e3;font-size:12px;color:#555}@media(max-width:700px){.v61-grid{grid-template-columns:1fr 1fr}.v61-insights{grid-template-columns:1fr}}@media(max-width:480px){.v61-grid{grid-template-columns:1fr}}
</style>").decode("utf-8")
          js = base64.b64decode("").decode("utf-8")

          # Rebuild the V61 dashboard runtime from a compact, validated script.
          js = '''<script id="v61-dashboard-runtime">
(function(){
const originalShowSection=window.showSection;let entries=[];
const dims=[["presence","Présence"],["impulse_control","Maîtrise de l’impulsion"],["values_coherence","Cohérence avec mes valeurs"],["self_relation","Relation à moi-même"]];
function score(v){const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=10?n:null}
function avg(r){const v=dims.map(x=>score(r&&r[x[0]])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function rows(){return entries.filter(r=>Number.isFinite(Number(r.day_number))).sort((a,b)=>Number(a.day_number)-Number(b.day_number))}
function make(){const app=document.getElementById("app");if(!app||document.getElementById("v61Dashboard"))return;const top=app.querySelector(".topbar");if(!top)return;const nav=top.querySelector(".nav-buttons");if(nav&&!document.getElementById("dashboardNavButton")){const b=document.createElement("button");b.id="dashboardNavButton";b.className="secondary";b.type="button";b.textContent="🏠 Tableau de bord";b.onclick=()=>window.showSection("dashboard");nav.insertBefore(b,nav.firstChild)}const sec=document.createElement("div");sec.id="v61Dashboard";sec.className="hidden v61-dashboard";sec.innerHTML='<div class="card"><h2 class="section-title">🏠 Mon tableau de bord</h2><p id="v61Welcome">Ton parcours en un coup d’œil.</p><div class="v61-progress"><span id="v61Bar"></span></div><div class="v61-grid"><div class="v61-stat"><span class="v61-label">Progression</span><strong id="v61Progress" class="v61-value">—</strong><span class="v61-note">jours du programme</span></div><div class="v61-stat"><span class="v61-label">Score global</span><strong id="v61Score" class="v61-value">—</strong><span id="v61ScoreNote" class="v61-note">sur 10</span></div><div class="v61-stat"><span class="v61-label">Streak</span><strong id="v61Streak" class="v61-value">—</strong><span class="v61-note">jours consécutifs</span></div><div class="v61-stat"><span class="v61-label">Dernière journée notée</span><strong id="v61Last" class="v61-value">—</strong><span class="v61-note">avec un score</span></div></div></div><div class="card"><h2 class="section-title">🧠 Analyse de mon évolution</h2><div class="v61-insights"><div class="v61-insight"><h3>📈 Progression depuis J1</h3><p id="v61Delta">—</p></div><div class="v61-insight"><h3>💪 Dimension qui progresse le plus</h3><p id="v61Strong">—</p></div><div class="v61-insight"><h3>🎯 Dimension à surveiller</h3><p id="v61Weak">—</p></div><div class="v61-insight"><h3>🔎 Lecture récente</h3><p id="v61Recent">—</p></div></div></div><div class="card"><h2 class="section-title">🗓️ Mes dernières journées</h2><div id="v61RecentList"></div></div>';top.insertAdjacentElement("afterend",sec)}
async function load(){try{const c=typeof getSupabaseClient==='function'?getSupabaseClient():null;if(!c)return;const {data:{user}}=await c.auth.getUser();if(!user)return;const r=await c.from("daily_entries").select("day_number,presence,impulse_control,values_coherence,self_relation").eq("user_id",user.id).order("day_number",{ascending:true});if(!r.error)entries=r.data||[]}catch(e){console.warn("V61 dashboard",e)}render()}
function render(){make();const box=document.getElementById("v61Dashboard");if(!box)return;const rs=rows(),sc=rs.filter(r=>avg(r)!==null),first=sc[0],last=sc[sc.length-1],cur=(typeof currentDay!=="undefined"?Number(currentDay):1)||1,p=Math.min(91,Math.max(0,last?Number(last.day_number):cur));document.getElementById("v61Progress").textContent=p+"/91";document.getElementById("v61Bar").style.width=(p/91*100)+"%";document.getElementById("v61Score").textContent=last?avg(last).toFixed(1)+"/10":"—";document.getElementById("v61ScoreNote").textContent=last?"J"+last.day_number:"aucun score enregistré";document.getElementById("v61Last").textContent=last?"J"+last.day_number:"—";const days=new Set(rs.map(r=>Number(r.day_number)));let latest=0;days.forEach(d=>{if(d>latest)latest=d});let st=0;for(let d=latest;latest&&days.has(d);d--)st++;document.getElementById("v61Streak").textContent=st;document.getElementById("v61Welcome").textContent="Jour "+cur+" — observe avant de juger, et garde le cap.";if(first&&last){const d=avg(last)-avg(first);document.getElementById("v61Delta").textContent=(d>=0?"+":"")+d.toFixed(1)+" point entre J"+first.day_number+" et J"+last.day_number+"."}else document.getElementById("v61Delta").textContent="Il faut au moins deux journées notées pour mesurer une progression.";const changes=dims.map(([k,l])=>{const x=sc.filter(r=>score(r[k])!==null);return x.length?{l,d:score(x[x.length-1][k])-score(x[0][k])}:null}).filter(Boolean).sort((a,b)=>b.d-a.d);document.getElementById("v61Strong").textContent=changes[0]?changes[0].l+" ("+(changes[0].d>=0?"+":"")+changes[0].d.toFixed(1)+")":"—";const recent=sc.slice(-7);const weak=dims.map(([k,l])=>{const v=recent.map(r=>score(r[k])).filter(x=>x!==null);return v.length?{l,a:v.reduce((a,b)=>a+b,0)/v.length}:null}).filter(Boolean).sort((a,b)=>a.a-b.a);document.getElementById("v61Weak").textContent=weak[0]?weak[0].l+" · "+weak[0].a.toFixed(1)+"/10 sur les 7 dernières journées":"—";document.getElementById("v61Recent").textContent=recent.length?"Moyenne des 7 dernières journées : "+(recent.reduce((a,r)=>a+avg(r),0)/recent.length).toFixed(1)+"/10.":"Continue à renseigner tes journées : l’analyse se précisera.";document.getElementById("v61RecentList").innerHTML=rs.slice(-5).reverse().map(r=>'<div class="v61-day"><span class="v61-badge">J'+r.day_number+'</span><strong>'+(avg(r)!==null?avg(r).toFixed(1)+"/10":"sans score")+'</strong></div>').join("")||"<p>Aucune journée sauvegardée pour le moment.</p>"}
window.showSection=function(section){make();if(section==="dashboard"){["programSection","journalSection","evolutionSection"].forEach(id=>document.getElementById(id)?.classList.add("hidden"));document.querySelectorAll(".nav-buttons button").forEach(b=>b.classList.remove("nav-active"));document.getElementById("v61Dashboard")?.classList.remove("hidden");document.getElementById("dashboardNavButton")?.classList.add("nav-active");load();return}document.getElementById("v61Dashboard")?.classList.add("hidden");document.getElementById("dashboardNavButton")?.classList.remove("nav-active");if(typeof originalShowSection==="function")originalShowSection(section)};
window.addEventListener("load",()=>setTimeout(()=>{make();load()},700));
})();
</script>'''
          if 'id="v61-dashboard-style"' not in html:
              html=html.replace('</head>',css+'\n</head>',1)
          if 'id="v61-dashboard-runtime"' not in html:
              html=html.replace('</body>',js+'\n</body>',1)

          checks=['>V61</div>','id="v61-dashboard-style"','id="v61-dashboard-runtime"','id="v61Dashboard"','id="dashboardNavButton"','Progression depuis J1','Dimension qui progresse le plus','Dimension à surveiller']
          for c in checks:
              if c not in html: raise SystemExit('Verification V61 echouee: '+c)
          if html.count('>V61</div>')!=1 or html.count('id="v61-dashboard-runtime"')!=1: raise SystemExit('Marqueurs V61 dupliques')
          payload={"message":"Update index.html V61 - dashboard and analysis","content":base64.b64encode(html.encode("utf-8")).decode("ascii"),"sha":data["sha"],"branch":"main"}
          put=urllib.request.Request(api,data=json.dumps(payload).encode("utf-8"),method="PUT",headers={**headers,"Content-Type":"application/json"})
          with urllib.request.urlopen(put) as r: result=json.load(r)
          print("V61 committed:",result["content"]["sha"])
          PY

      - name: Verify V61
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          api=f"https://api.github.com/repos/{repo}/contents/index.html?ref=main"
          req=urllib.request.Request(api,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          html=base64.b64decode(data["content"]).decode("utf-8")
          for c in [">V61</div>",'id="v61-dashboard-style"','id="v61-dashboard-runtime"','id="v61Dashboard"','Progression depuis J1','Dimension qui progresse le plus','Dimension à surveiller']:assert c in html,c
          assert html.count(">V61</div>")==1
          assert html.count('id="v61-dashboard-runtime"')==1
          print("V61 verified:",data["sha"])
          PY
