name: Recover V45 and patch V51
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    if: "!contains(github.event.head_commit.message, 'V51 - base V45')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const v45 = '60426c72c7ea5a612f8a958647b01b1b07923cba';
            const { data: file } = await github.rest.repos.getContent({owner, repo, path:'index.html', ref:v45});
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            s = s.replace('<div class="app-version-v18">V45</div>', '<div class="app-version-v18">V51</div>');
            s = s.replace('/* V45 - protection contre les changements de jour avec modifications non sauvegardées */', '/* V51 - base V45 + restauration fiable du tableau depuis la BDD */');
            s = s.replace('// V45 : toute modification de formulaire rend la journée "sale".', '// V51 : base V45 conservée ; seul le correctif de restauration BDD est appliqué.');
            const oldLoad = `    document.getElementById("exerciseResponse").value =\n      data.exercise_response || "";\n`;
            const newLoad = `    const rawExerciseResponse = data.exercise_response || "";\n    const hasStructuredBlocks = /(?:^|\\n)(?:PRATIQUE DU JOUR|TRACE ÉCRITE|TABLEAU CONTRÔLE \/ INFLUENCE \/ HORS CONTRÔLE|DÉCISION SANS VALIDATION|BILAN DE SEMAINE — SCORES)\\n/i.test(rawExerciseResponse);\n    document.getElementById("exerciseResponse").value = hasStructuredBlocks ? "" : rawExerciseResponse;\n`;
            if (!s.includes(oldLoad)) throw new Error('loadExistingEntry cible absente dans V45');
            s = s.replace(oldLoad,newLoad);
            const oldClear = `    ["practiceResponse","traceResponse","actionResponseInline","eveningResponseInline"].forEach(id => { const el=document.getElementById(id); if(el) el.value=""; });\n\n    document.getElementById("saveStatus").textContent = "";\n`;
            const newClear = `    ["practiceResponse","traceResponse","actionResponseInline","eveningResponseInline"].forEach(id => { const el=document.getElementById(id); if(el) el.value=""; });\n\n    const body = document.getElementById("controlTableBody");\n    if (body) {\n      body.innerHTML = "";\n      for (let i = 0; i < 3; i++) addControlRow();\n    }\n\n    document.getElementById("saveStatus").textContent = "";\n`;
            if (!s.includes(oldClear)) throw new Error('clearProgramJournal cible absente dans V45');
            s = s.replace(oldClear,newClear);
            const start = s.indexOf('  function restoreControlTable(text) {');
            const end = s.indexOf('\n  function parseScore(id)',start);
            if (start < 0 || end < 0) throw new Error('restoreControlTable absente dans V45');
            const fn = `  function restoreControlTable(text) {\n    const body = document.getElementById("controlTableBody");\n    if (!body) return;\n\n    body.innerHTML = "";\n    const raw = String(text || "");\n    const marker = "TABLEAU CONTRÔLE / INFLUENCE / HORS CONTRÔLE";\n    const jsonMarker = "__CONTROL_TABLE_JSON__";\n    const endMarker = "\\n__FIN_TABLEAU_CONTROLE__";\n\n    // La BDD peut contenir d'anciennes sauvegardes concaténées.\n    // Le dernier JSON est l'état le plus récent et doit être restauré.\n    const jsonPos = raw.lastIndexOf(jsonMarker);\n    if (jsonPos >= 0) {\n      const jsonEnd = raw.indexOf(endMarker, jsonPos);\n      const json = raw.slice(jsonPos + jsonMarker.length, jsonEnd >= 0 ? jsonEnd : raw.length).trim();\n      try {\n        const rows = JSON.parse(json);\n        if (Array.isArray(rows)) {\n          rows.slice(0, 15).forEach(values => {\n            if (Array.isArray(values)) addControlRow([values[0] || "", values[1] || "", values[2] || ""]);\n          });\n          return;\n        }\n      } catch (e) {\n        console.warn("Impossible de restaurer le dernier tableau JSON", e);\n      }\n    }\n\n    const start = raw.lastIndexOf(marker);\n    if (start < 0) {\n      for (let i = 0; i < 3; i++) addControlRow();\n      return;\n    }\n\n    let section = raw.slice(start + marker.length);\n    const endPos = section.indexOf(endMarker);\n    if (endPos >= 0) section = section.slice(0, endPos).trim();\n\n    const nextMarkers = [\n      "\\nDÉCISION SANS VALIDATION\\n",\n      "\\nBILAN DE SEMAINE — SCORES\\n"\n    ];\n    let legacySection = section;\n    if (endPos < 0) {\n      let end = legacySection.length;\n      nextMarkers.forEach(m => {\n        const idx = legacySection.indexOf(m);\n        if (idx >= 0 && idx < end) end = idx;\n      });\n      legacySection = legacySection.slice(0, end).trim();\n    }\n\n    const rows = legacySection ? legacySection.split("\\n") : [];\n    rows.forEach(line => {\n      const m = line.match(/^\\d+\\.\\s*Contrôle:\\s*(.*?)\\s*\\|\\s*Influence:\\s*(.*?)\\s*\\|\\s*Hors contrôle:\\s*(.*)$/);\n      if (m) addControlRow([m[1], m[2], m[3]]);\n    });\n\n    if (!rows.length) {\n      for (let i = 0; i < 3; i++) addControlRow();\n    }\n  }\n`;
            s = s.slice(0,start) + fn + s.slice(end);
            const required = [
              '<div class="app-version-v18">V51</div>',
              'const rawExerciseResponse = data.exercise_response || "";',
              'const jsonPos = raw.lastIndexOf(jsonMarker);',
              'function signIn() {',
              'await supabaseClient.auth.signInWithPassword',
              'document.addEventListener("beforeunload"',
            ];
            for (const x of required) if (!s.includes(x)) throw new Error('V51 validation failed: '+x);
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'index.html',message:'V51 - base V45',content:Buffer.from(s,'utf8').toString('base64'),sha:(await github.rest.repos.getContent({owner,repo,path:'index.html',ref:'main'})).data.sha,branch:'main'});
