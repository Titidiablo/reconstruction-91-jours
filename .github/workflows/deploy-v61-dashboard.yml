name: Deploy V61 dashboard

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply V61 dashboard and analysis
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '>V61</div>' not in s:
              if '>V60</div>' not in s: raise SystemExit('V60 badge not found')
              s = s.replace('>V60</div>', '>V61</div>', 1)
          if 'id="v61-dashboard-style"' not in s:
              css = r'''
<style id="v61-dashboard-style">
.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.dashboard-stat{background:#f7f5f1;border:1px solid #ddd9d1;border-radius:12px;padding:14px;min-width:0}.dashboard-stat-label{display:block;color:#777;font-size:12px;margin-bottom:5px}.dashboard-stat-value{display:block;font-size:24px;font-weight:700;line-height:1.15}.dashboard-stat-note{display:block;color:#777;font-size:12px;margin-top:5px}.dashboard-insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.dashboard-insight{background:white;border:1px solid #e1ddd6;border-radius:12px;padding:14px}.dashboard-insight h3{margin:0 0 6px;font-size:16px}.dashboard-insight p{margin:0;color:#444}.dashboard-progress{height:10px;background:#e6e2db;border-radius:999px;overflow:hidden;margin-top:10px}.dashboard-progress > span{display:block;height:100%;background:#333;border-radius:999px;width:0;transition:width .25s ease}.dashboard-mini-list{margin:8px 0 0;padding-left:18px}.dashboard-mini-list li{margin:4px 0}.dashboard-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee9e3;font-size:12px;color:#555}@media (max-width:700px){.dashboard-grid{grid-template-columns:1fr 1fr}.dashboard-insight-grid{grid-template-columns:1fr}}@media (max-width:480px){.dashboard-grid{grid-template-columns:1fr}}
</style>
'''
              s = s.replace('</head>', css + '</head>', 1)
          if 'id="v61-dashboard-runtime"' not in s:
              js = r'''
<script id="v61-dashboard-runtime">
(function(){
  let v61OriginalShowSection=window.showSection,v61Entries=[];
  function valid(v){const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=10?n:null}
  function avg(r){const v=[r?.presence,r?.impulse_control,r?.values_coherence,r?.self_relation].map(valid).filter(v=>v!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
  function sorted(){return [...v61Entries].filter(r=>Number.isFinite(Number(r.day_number))).sort((a,b)=>Number(a.day_number)-Number(b.day_number))}
  function scored(){return sorted().filter(r=>avg(r)!==null)}
  function make(){const app=document.getElementById('app'),top=app?.querySelector('.topbar');if(!app||!top||document.getElementById('v61Dashboard'))return;const nav=top.querySelector('.nav-buttons');if(nav&&!document.getElementById('dashboardNavButton')){const b=document.createElement('button');b.id='dashboardNavButton';b.className='secondary';b.type='button';b.textContent='🏠 Tableau de bord';b.onclick=()=>window.showSection('dashboard');nav.insertBefore(b,nav.firstChild)}const sec=document.createElement('div');sec.id='v61Dashboard';sec.className='hidden';sec.innerHTML=`<div class="card"><h2 class="section-title">🏠 Mon tableau de bord</h2><p id="v61WelcomeLine">Ton parcours en un coup d’œil.</p><div class="dashboard-progress"><span id="v61ProgressBar"></span></div><div class="dashboard-grid"><div class="dashboard-stat"><span class="dashboard-stat-label">Progression</span><strong id="v61Progress" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">jours du programme</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Score global</span><strong id="v61Score" class="dashboard-stat-value">—</strong><span id="v61ScoreNote" class="dashboard-stat-note">sur 10</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Streak</span><strong id="v61Streak" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">jours consécutifs sauvegardés</span></div><div class="dashboard-stat"><span class="dashboard-stat-label">Dernière journée</span><strong id="v61LastDay" class="dashboard-stat-value">—</strong><span class="dashboard-stat-note">dernière journée avec score</span></div></div></div><div class="card"><h2 class="section-title">🧠 Analyse de mon évolution</h2><div class="dashboard-insight-grid"><div class="dashboard-insight"><h3>📈 Progression depuis J1</h3><p id="v61Delta">—</p></div><div class="dashboard-insight"><h3>💪 Dimension qui progresse le plus</h3><p id="v61Strongest">—</p></div><div class="dashboard-insight"><h3>🎯 Dimension à surveiller</h3><p id="v61Weakest">—</p></div><div class="dashboard-insight"><h3>🔎 Lecture récente</h3><p id="v61Recent">—</p></div></div></div><div class="card"><h2 class="section-title">🗓️ Mes dernières journées</h2><div id="v61RecentList">—</div></div>`;top.insertAdjacentElement('afterend',sec)}
  async function load(){try{const client=typeof getSupabaseClient==='function'?getSupabaseClient():null;if(!client)return;const {data:{user}}=await client.auth.getUser();if(!user)return;const {data,error}=await client.from('daily_entries').select('day_number,presence,impulse_control,values_coherence,self_relation').eq('user_id',user.id).order('day_number',{ascending:true});if(!error)v61Entries=data||[]}catch(e){console.warn('V61 dashboard',e)}render()}
  function render(){make();const rows=sorted(),sc=scored(),first=sc[0],last=sc[sc.length-1];if(!document.getElementById('v61Dashboard'))return;const progress=Math.max(0,Math.min(91,last?Number(last.day_number):(typeof currentDay!=='undefined'?Number(currentDay):1)));document.getElementById('v61Progress').textContent=progress+'/91';document.getElementById('v61ProgressBar').style.width=(progress/91*100)+'%';document.getElementById('v61Score').textContent=last?avg(last).toFixed(1)+'/10':'—';document.getElementById('v61ScoreNote').textContent=last?'J'+last.day_number:'aucun score enregistré';document.getElementById('v61Streak').textContent=(function(){const ds=new Set(rows().map(r=>Number(r.day_number)));let m=0;ds.forEach(d=>{if(d>m)m=d});let n=0;for(let d=m;m&&ds.has(d);d--)n++;return n})();document.getElementById('v61LastDay').textContent=last?'J'+last.day_number:'—';document.getElementById('v61WelcomeLine').textContent='Jour '+(typeof currentDay!=='undefined'?currentDay:1)+' — garde le cap, observe avant de juger.';document.getElementById('v61Delta').textContent=first&&last?(((avg(last)-avg(first)>=0?'+':'')+(avg(last)-avg(first)).toFixed(1)+' point'+(Math.abs(avg(last)-avg(first))>=2?'s':'')+' entre J'+first.day_number+' et J'+last.day_number+'.')):'Il faut au moins deux journées notées pour mesurer une progression.';const dims=[['presence','Présence'],['impulse_control','Maîtrise de l’impulsion'],['values_coherence','Cohérence avec mes valeurs'],['self_relation','Relation à moi-même']];const ch=dims.map(([k,label])=>{const a=sc.filter(r=>valid(r[k])!==null);return a.length?{label,delta:valid(a[a.length-1][k])-valid(a[0][k])}:null}).filter(Boolean).sort((a,b)=>b.delta-a.delta);document.getElementById('v61Strongest').textContent=ch[0]?ch[0].label+' ('+(ch[0].delta>=0?'+':'')+ch[0].delta.toFixed(1)+')':'—';const recent=sc.slice(-7),low=dims.map(([k,label])=>{const a=recent.map(r=>valid(r[k])).filter(v=>v!==null);return a.length?{label,avg:a.reduce((x,y)=>x+y,0)/a.length}:null}).filter(Boolean).sort((a,b)=>a.avg-b.avg);document.getElementById('v61Weakest').textContent=low[0]?low[0].label+' · '+low[0].avg.toFixed(1)+'/10 sur les 7 derniers scores':'—';document.getElementById('v61Recent').textContent=recent.length?'Moyenne des 7 derniers scores : '+(recent.reduce((a,r)=>a+avg(r),0)/recent.length).toFixed(1)+'/10 (ensemble du parcours : '+(sc.reduce((a,r)=>a+avg(r),0)/sc.length).toFixed(1)+').':'Continue à renseigner tes journées : l’analyse deviendra plus pertinente avec le temps.';document.getElementById('v61RecentList').innerHTML=rows.slice(-5).reverse().map(r=>`<div class="dashboard-insight" style="margin-top:8px"><span class="dashboard-badge">J${r.day_number}</span> <strong>${avg(r)!==null?avg(r).toFixed(1)+'/10':'sans score'}</strong></div>`).join('')||'<div class="empty">Aucune journée sauvegardée pour le moment.</div>'}
  window.showSection=function(section){make();if(section==='dashboard'){['programSection','journalSection','evolutionSection'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));document.querySelectorAll('.nav-buttons button').forEach(b=>b.classList.remove('nav-active'));document.getElementById('v61Dashboard')?.classList.remove('hidden');document.getElementById('dashboardNavButton')?.classList.add('nav-active');load();return}document.getElementById('v61Dashboard')?.classList.add('hidden');document.getElementById('dashboardNavButton')?.classList.remove('nav-active');if(typeof v61OriginalShowSection==='function')v61OriginalShowSection(section)};
  window.addEventListener('load',()=>setTimeout(()=>{make();load()},700));
})();
</script>
'''
              s=s.replace('</body>',js+'</body>',1)
          checks=['>V61</div>','id="v61-dashboard-style"','id="v61-dashboard-runtime"','id="v61Dashboard"','id="dashboardNavButton"','function v61Render()','Progression depuis J1','Dimension qui progresse le plus','Dimension à surveiller']
          # Preserve prior runtime naming if present; enforce core V61 content.
          for c in checks:
              if c not in s: raise SystemExit('Missing V61 content: '+c)
          if s.count('id="v61-dashboard-runtime"')!=1 or s.count('>V61</div>')!=1: raise SystemExit('V61 duplicate marker')
          p.write_text(s,encoding='utf-8')

      - name: Validate V61
        run: |
          grep -q '>V61</div>' index.html
          grep -q 'id="v61-dashboard-style"' index.html
          grep -q 'id="v61-dashboard-runtime"' index.html
          grep -q 'id="v61Dashboard"' index.html
          grep -q 'id="dashboardNavButton"' index.html
          grep -q 'Progression depuis J1' index.html
          grep -q 'Dimension qui progresse le plus' index.html
          grep -q 'Dimension à surveiller' index.html
          test "$(grep -o 'id=\"v61-dashboard-runtime\"' index.html | wc -l)" -eq 1
          test "$(grep -o '>V61</div>' index.html | wc -l)" -eq 1

      - name: Commit V61
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update index.html V61 - dashboard and analysis'
          git push
