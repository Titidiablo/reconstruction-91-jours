name: Deploy V97

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare V64
        run: python3 scripts/deploy_v64.py
      - name: Fix V64 mobile save button
        run: python3 scripts/patch_v64_mobile.py
      - name: Apply V65 navigation
        run: python3 scripts/patch_v65_navigation.py
      - name: Apply V66 Program cleanup
        run: python3 scripts/patch_v66_today_program.py
      - name: Apply V67 Program active navigation
        run: python3 scripts/patch_v67_program_active.py
      - name: Apply V68 Dashboard / Programme separation
        run: python3 scripts/patch_v68_dashboard_program.py
      - name: Apply V69 Dashboard cleanup
        run: python3 scripts/patch_v69_dashboard_cleanup.py
      - name: Apply V70 restore structure
        run: python3 scripts/patch_v70_restore_structure.py
      - name: Apply V71 remove 91 day grid
        run: python3 scripts/patch_v71_remove_day_grid.py
      - name: Apply V80 navigation fix
        run: python3 scripts/patch_v75_dashboard_today_isolation.py
      - name: Apply V81 Media menu
        run: python3 scripts/patch_v81_media.py
      - name: Apply V82 tagline
        run: python3 scripts/patch_v82_subtitle.py
      - name: Apply V83 media upload fix
        run: python3 scripts/patch_v83_media_upload.py
      - name: Apply V84 media upload UI and fallback
        run: python3 scripts/patch_v84_media_upload_ui.py
      - name: Apply V85 media categories and meditation picker
        run: python3 scripts/patch_v85_media_program.py
      - name: Apply V87 media filename title
        run: python3 scripts/patch_v87_media_filename_title.py
      - name: Apply V88 meditation picker position
        run: python3 scripts/patch_v88_meditation_picker_position.py
      - name: Apply V89 exact meditation block position
        run: python3 scripts/patch_v89_meditation_picker_exact_position.py
      - name: Apply V90 button selection fix
        run: python3 scripts/patch_v90_button_selection.py
      - name: Apply V91 default Today button
        run: python3 scripts/patch_v91_default_today_button.py
      - name: Apply V92 zen design
        run: python3 scripts/patch_v92_zen_design.py
      - name: Apply V93 zen imagery
        run: python3 scripts/patch_v93_zen_images.py
      - name: Apply V94 developed evolution scores
        run: python3 scripts/patch_v94_evolution_scores.py
      - name: Apply V95 four-pillar bilan
        run: python3 scripts/patch_v95_bilan_piliers.py
      - name: Apply V96 detailed Mes repères
        run: python3 scripts/patch_v96_reperes_detail.py
      - name: Apply V96 mobile score layout
        run: python3 scripts/patch_v96_mobile_score_layout.py
      - name: Apply V97 evolution mobile no overlap
        run: python3 scripts/patch_v97_evolution_mobile_no_overlap.py

      - name: Set displayed version V97
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('V64','V67','V68','V69','V70','V71','V72','V73','V74','V75','V76','V77','V78','V79','V80','V81','V82','V83','V84','V85','V86','V87','V88','V89','V90','V91','V92','V93','V94','V95','V96'):
              s=s.replace(f'>{old}</div>','>V97</div>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate V97
        run: |
          grep -q '>V97</div>' index.html
          grep -q 'id="v97-evolution-mobile-no-overlap"' index.html
          grep -q 'id="v96-reperes-detail"' index.html
          grep -q 'id="v96-mobile-score-layout"' index.html
          grep -q 'id="v95-bilan-piliers"' index.html
          grep -q 'id="v94-evolution-scores"' index.html
          grep -q 'DEVENIR SOI' index.html
          grep -q 'Ne subissez plus votre vie. Reprenez le contrôle !' index.html
          test "$(grep -o '>V97</div>' index.html | wc -l)" -eq 1
      - name: Commit V97
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "V97 déjà présent"; exit 0; fi
          git commit -m "V97 - eliminate mobile evolution overlaps"
          git pull --rebase origin main
          git push origin HEAD:main
# V97 mobile overlap fix - 2026-09-08T13:55:00Z
