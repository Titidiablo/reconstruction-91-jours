name: Deploy V63

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare V63
        run: python3 scripts/deploy_v63.py

      - name: Validate V63
        run: |
          grep -q '>V63</div>' index.html
          grep -q 'id="v63-resources-runtime"' index.html
          grep -q 'id="v63-resources-style"' index.html
          grep -q 'personal_resources' index.html
          grep -q 'personal-resources' index.html
          test "$(grep -o '>V63</div>' index.html | wc -l)" -eq 1

      - name: Commit V63
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "V63 déjà présent"
          else
            git commit -m "Update index.html V63 - resources"
            git push
          fi
