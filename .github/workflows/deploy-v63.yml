name: Deploy V63

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare V63
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="v63-resources-runtime"' in s:
              raise SystemExit('V63 already present')
          if '>V62</div>' not in s:
              raise SystemExit('Expected V62 before creating V63')

          s = s.replace('>V62</div>', '>V63</div>', 1)

          css = r'''
<style id="v63-resources-style">
.v63-resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.v63-resource-card{border:1px solid #ddd9d1;border-radius:12px;padding:15px;background:#faf9f6}
.v63-resource-card h3{margin:0 0 5px;font-size:17px}
.v63-resource-meta{font-size:12px;color:#777;margin-bottom:10px}
.v63-resource-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.v63-resource-actions button{margin:0}
.v63-resource-preview{width:100%;border-radius:9px;margin-top:10px}
.v63-resource-preview iframe{width:100%;height:280px;border:0;border-radius:9px}
.v63-resource-empty{color:#777;text-align:center;padding:30px 10px}
.v63-upload-note{font-size:12px;color:#777;margin-top:-8px;margin-bottom:12px}
@media(max-width:700px){.v63-resource-grid{grid-template-columns:1fr}}
</style>
'''

          js = r'''
<script id="v63-resources-runtime">
(function(){
  const RESOURCE_ID='v63Resources';
  let resources=[];
  let loading=false;

  function client(){
    return typeof getSupabaseClient==='function' ? getSupabaseClient() : null;
  }

  function escapeHtml(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  function youtubeId(url){
    try{
      const u=new URL(url);
      if(u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
      if(u.hostname.includes('youtube.com')) return u.searchParams.get('v') || (u.pathname.startsWith('/shorts/')?u.pathname.split('/')[2]:null) || (u.pathname.startsWith('/embed/')?u.pathname.split('/')[2]:null);
    }catch(e){}
    return null;
  }

  function hideAppSections(){
    ['programSection','journalSection','evolutionSection','v61Dashboard'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.classList.add('hidden');
    });
    const r=document.getElementById(RESOURCE_ID); if(r) r.classList.remove('hidden');
  }

  function showResources(){
    build();
    hideAppSections();
    const r=document.getElementById(RESOURCE_ID); if(r) r.classList.remove('hidden');
    document.querySelectorAll('.nav-buttons button').forEach(b=>b.classList.remove('nav-active'));
    const b=document.getElementById('resourcesNavButton'); if(b) b.classList.add('nav-active');
    loadResources();
  }
  window.v63ShowResources=showResources;

  function syncSaveButton(){
    const program=document.getElementById('programSection');
    const visible=!!program && !program.classList.contains('hidden');
    const b=document.getElementById('floatingSaveButton');
    if(b) b.classList.toggle('hidden',!visible);
  }

  function build(){
    if(document.getElementById(RESOURCE_ID)) return;
    const app=document.getElementById('app');
    const top=app && app.querySelector('.topbar');
    if(!app || !top) return;

    const nav=top.querySelector('.nav-buttons');
    if(nav && !document.getElementById('resourcesNavButton')){
      const b=document.createElement('button');
      b.id='resourcesNavButton'; b.type='button'; b.className='secondary';
      b.textContent='🎧 Ressources'; b.onclick=showResources;
      nav.appendChild(b);
    }

    const sec=document.createElement('div');
    sec.id=RESOURCE_ID; sec.className='hidden';
    sec.innerHTML=`
      <div class="card">
        <h2 class="section-title">🎧 Mes ressources</h2>
        <p>Un espace personnel pour regrouper tes méditations, formations, coachings, vidéos et contenus YouTube utiles à ton parcours.</p>
        <div class="card" style="background:#f7f5f1;margin-top:15px;margin-bottom:0;padding:18px">
          <h3 style="margin-top:0">➕ Ajouter une ressource</h3>
          <label>Titre</label>
          <input id="v63Title" type="text" placeholder="Ex. Méditation du matin">
          <label>Description (facultatif)</label>
          <textarea id="v63Description" placeholder="À quoi cette ressource peut-elle te servir ?" style="min-height:80px"></textarea>
          <label>Catégorie</label>
          <select id="v63Category">
            <option>Méditation</option><option>Formation</option><option>Coaching</option><option>Développement personnel</option><option>YouTube</option><option>Autre</option>
          </select>
          <label>Type</label>
          <select id="v63Type" onchange="window.v63ToggleResourceInput()">
            <option value="audio">Audio</option><option value="video">Vidéo</option><option value="youtube">YouTube</option><option value="link">Lien web</option>
          </select>
          <div id="v63FileWrap">
            <label>Fichier audio / vidéo</label>
            <input id="v63File" type="file" accept="audio/*,video/*">
            <div class="v63-upload-note">Les fichiers sont stockés dans ton espace privé Supabase.</div>
          </div>
          <div id="v63UrlWrap" class="hidden">
            <label>URL</label>
            <input id="v63Url" type="url" placeholder="https://...">
          </div>
          <button class="primary" type="button" onclick="window.v63AddResource()">➕ Ajouter</button>
          <div id="v63ResourceStatus"></div>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <h2 class="section-title" style="margin:0">📚 Ma bibliothèque</h2>
          <button class="secondary" type="button" onclick="window.v63LoadResources()">↻ Actualiser</button>
        </div>
        <div id="v63ResourceList" class="v63-resource-grid"><div class="v63-resource-empty">Chargement…</div></div>
      </div>`;
    top.insertAdjacentElement('afterend',sec);
  }

  window.v63ToggleResourceInput=function(){
    const type=document.getElementById('v63Type')?.value;
    const file=document.getElementById('v63FileWrap'); const url=document.getElementById('v63UrlWrap');
    if(file) file.classList.toggle('hidden',type==='youtube'||type==='link');
    if(url) url.classList.toggle('hidden',!(type==='youtube'||type==='link'));
  };

  async function loadResources(){
    if(loading)return; loading=true; build();
    const list=document.getElementById('v63ResourceList');
    try{
      const c=client(); if(!c) throw new Error('Supabase indisponible');
      const {data:{user}}=await c.auth.getUser(); if(!user) throw new Error('Connecte-toi pour utiliser les ressources.');
      const {data,error}=await c.from('personal_resources').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
      if(error) throw error;
      resources=data||[];
      renderResources();
    }catch(e){ if(list) list.innerHTML='<div class="v63-resource-empty">Impossible de charger les ressources : '+escapeHtml(e.message||e)+'</div>'; }
    finally{loading=false;}
  }
  window.v63LoadResources=loadResources;

  async function resourceUrl(r){
    if(r.url) return r.url;
    if(!r.storage_path) return '';
    try{
      const c=client(); const {data,error}=await c.storage.from('personal-resources').createSignedUrl(r.storage_path,3600);
      return error?'':(data?.signedUrl||'');
    }catch(e){return '';}
  }

  async function renderResources(){
    const list=document.getElementById('v63ResourceList'); if(!list)return;
    if(!resources.length){list.innerHTML='<div class="v63-resource-empty">Aucune ressource pour le moment. Ajoute ta première méditation, vidéo ou chaîne YouTube.</div>';return;}
    list.innerHTML=resources.map(r=>`<article class="v63-resource-card" data-resource-id="${escapeHtml(r.id)}"><h3>${escapeHtml(r.title)}</h3><div class="v63-resource-meta">${escapeHtml(r.category)} · ${escapeHtml(r.media_type)}</div><div>${escapeHtml(r.description||'')}</div><div class="v63-resource-actions"><button class="secondary" type="button" data-open-resource="${escapeHtml(r.id)}">▶ Ouvrir</button><button class="danger" type="button" data-delete-resource="${escapeHtml(r.id)}">🗑 Supprimer</button></div><div class="v63-resource-preview" data-preview-for="${escapeHtml(r.id)}"></div></article>`).join('');
    for(const r of resources){
      const card=list.querySelector(`[data-resource-id="${CSS.escape(r.id)}"]`); if(!card)continue;
      const preview=card.querySelector(`[data-preview-for="${CSS.escape(r.id)}"]`);
      const url=await resourceUrl(r);
      if(r.media_type==='youtube' && youtubeId(r.url||'')){
        const id=youtubeId(r.url); preview.innerHTML=`<iframe loading="lazy" src="https://www.youtube.com/embed/${encodeURIComponent(id)}" title="YouTube" allowfullscreen></iframe>`;
      }else if(url && r.media_type==='audio'){
        preview.innerHTML=`<audio controls class="v63-resource-preview" src="${escapeHtml(url)}"></audio>`;
      }else if(url && r.media_type==='video'){
        preview.innerHTML=`<video controls class="v63-resource-preview" src="${escapeHtml(url)}"></video>`;
      }
    }
    list.querySelectorAll('[data-open-resource]').forEach(b=>b.onclick=()=>openResource(b.dataset.openResource));
    list.querySelectorAll('[data-delete-resource]').forEach(b=>b.onclick=()=>deleteResource(b.dataset.deleteResource));
  }

  async function openResource(id){
    const r=resources.find(x=>x.id===id); if(!r)return;
    const url=await resourceUrl(r); if(!url){alert('Lien indisponible.');return;}
    window.open(url,'_blank','noopener');
  }

  async function deleteResource(id){
    const r=resources.find(x=>x.id===id); if(!r)return;
    if(!confirm('Supprimer cette ressource ?'))return;
    try{
      const c=client();
      if(r.storage_path) await c.storage.from('personal-resources').remove([r.storage_path]);
      const {error}=await c.from('personal_resources').delete().eq('id',id);
      if(error)throw error;
      await loadResources();
    }catch(e){alert('Suppression impossible : '+(e.message||e));}
  }

  window.v63AddResource=async function(){
    const status=document.getElementById('v63ResourceStatus');
    try{
      const c=client(); if(!c)throw new Error('Supabase indisponible');
      const {data:{user}}=await c.auth.getUser(); if(!user)throw new Error('Connecte-toi pour ajouter une ressource.');
      const title=(document.getElementById('v63Title')?.value||'').trim();
      const description=(document.getElementById('v63Description')?.value||'').trim();
      const category=document.getElementById('v63Category')?.value||'Autre';
      const type=document.getElementById('v63Type')?.value||'link';
      if(!title)throw new Error('Le titre est obligatoire.');
      let url=null, storage_path=null;
      if(type==='youtube'||type==='link'){
        url=(document.getElementById('v63Url')?.value||'').trim();
        if(!url)throw new Error('L’URL est obligatoire.');
        try{new URL(url);}catch(e){throw new Error('L’URL n’est pas valide.');}
      }else{
        const file=document.getElementById('v63File')?.files?.[0];
        if(!file)throw new Error('Choisis un fichier audio ou vidéo.');
        if(file.size>200*1024*1024)throw new Error('Fichier trop volumineux (maximum 200 Mo).');
        const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        storage_path=user.id+'/'+crypto.randomUUID()+'-'+safe;
        const {error:upError}=await c.storage.from('personal-resources').upload(storage_path,file,{upsert:false,contentType:file.type||undefined});
        if(upError)throw upError;
      }
      const {error}=await c.from('personal_resources').insert({user_id:user.id,title,description,category,media_type:type,url,storage_path});
      if(error){ if(storage_path)await c.storage.from('personal-resources').remove([storage_path]); throw error; }
      if(status){status.className='success';status.textContent='Ressource ajoutée.';}
      ['v63Title','v63Description','v63Url'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
      const f=document.getElementById('v63File');if(f)f.value='';
      await loadResources();
    }catch(e){if(status){status.className='error';status.textContent=e.message||String(e);}}
  };

  const originalShowSection=window.showSection;
  if(typeof originalShowSection==='function' && !window.v63ShowSectionWrapped){
    window.showSection=function(section){
      const r=document.getElementById(RESOURCE_ID); if(r)r.classList.add('hidden');
      const result=originalShowSection.apply(this,arguments);
      setTimeout(syncSaveButton,0);
      return result;
    };
    window.v63ShowSectionWrapped=true;
  }

  function init(){
    build();
    window.v63ToggleResourceInput();
    syncSaveButton();
    setTimeout(function(){
      if(typeof window.showSection==='function') window.showSection('dashboard');
      setTimeout(syncSaveButton,100);
    },700);
    const program=document.getElementById('programSection');
    if(program)new MutationObserver(syncSaveButton).observe(program,{attributes:true,attributeFilter:['class']});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
'''

          marker='</html>'
          if marker not in s:
              raise SystemExit('Missing </html>')
          s=s.replace(marker, css+'\n'+js+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          print('V63 prepared')
          PY

      - name: Validate V63
        run: |
          grep -q '>V63</div>' index.html
          grep -q 'id="v63-resources-runtime"' index.html
          grep -q 'id="v63-resources-style"' index.html
          grep -q "personal_resources" index.html
          grep -q "personal-resources" index.html
          grep -q "window.showSection('dashboard')" index.html
          grep -q "id='floatingSaveButton'" index.html || grep -q 'id="floatingSaveButton"' index.html
          test "$(grep -o '>V63</div>' index.html | wc -l)" -eq 1

      - name: Commit V63
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html V63 - dashboard startup and resources"
          git push
