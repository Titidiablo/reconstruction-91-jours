name: Deploy V63

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate V63 workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # This workflow is intentionally kept as a manual V63 deployment.
          # The previous version embedded a large Python triple-quoted HTML/JS
          # payload directly in YAML. Its payload lines were not indented as
          # YAML block content, which made the workflow itself invalid.
          required = [
              'id="v61-dashboard-runtime"',
              'id="v61Dashboard"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing required base markers: " + ", ".join(missing))
          print("V63 workflow YAML is valid; base application markers found.")
          PY
