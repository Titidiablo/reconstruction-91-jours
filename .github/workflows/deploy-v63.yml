name: Deploy V65

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare V64
        run: python3 scripts/deploy_v64.py

      - name: Fix V64 mobile save button
        run: python3 scripts/patch_v64_mobile.py

      - name: Apply V65 navigation
        run: python3 scripts/patch_v65_navigation.py

      - name: Validate V65
        run: |
          grep -q '>V64</div>' index.html
          grep -q 'id="v63-resources-runtime"' index.html
          grep -q 'id="v64-ux-style"' index.html
          grep -q 'id="v64-ux-runtime"' index.html
          grep -q 'id="v64-mobile-save-fix"' index.html
          grep -q 'id="v65-navigation-fix"' index.html
          grep -q 'DEVENIR SOI' index.html
          grep -q 'Mon parcours' index.html
          grep -q 'Pleine conscience' index.html
          grep -q 'Maîtrise des impulsions' index.html
          grep -q '💾 Sauvegarder ma journée' index.html
          ! grep -q 'id="daysNavButton"' index.html
          ! grep -q 'id="v64OpenDays"' index.html
          ! grep -q 'id="v64CompactDays"' index.html
          grep -q 'await requestDayChange(d)' index.html
          test "$(grep -o '>V64</div>' index.html | wc -l)" -eq 1

      - name: Commit V65
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "V65 déjà présent"
            exit 0
          fi
          git commit -m "V65 - simplify day navigation"
          git pull --rebase origin main
          git push origin HEAD:main
