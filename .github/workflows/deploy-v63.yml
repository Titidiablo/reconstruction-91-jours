name: Deploy V73

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare V64
        run: python3 scripts/deploy_v64.py
      - name: Fix V64 mobile save button
        run: python3 scripts/patch_v64_mobile.py
      - name: Apply V65 navigation
        run: python3 scripts/patch_v65_navigation.py
      - name: Apply V66 Program cleanup
        run: python3 scripts/patch_v66_today_program.py
      - name: Apply V67 Program active navigation
        run: python3 scripts/patch_v67_program_active.py
      - name: Apply V68 Dashboard / Programme separation
        run: python3 scripts/patch_v68_dashboard_program.py
      - name: Apply V69 Dashboard cleanup
        run: python3 scripts/patch_v69_dashboard_cleanup.py
      - name: Apply V70 restore structure
        run: python3 scripts/patch_v70_restore_structure.py
      - name: Apply V71 remove 91 day grid
        run: python3 scripts/patch_v71_remove_day_grid.py
      - name: Apply V73 restore Dashboard header without Today duplicates
        run: python3 scripts/patch_v73_dashboard_restore_header.py

      - name: Set displayed version V73
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for old in ('V64','V67','V68','V69','V70','V71','V72'):
              s = s.replace(f'>{old}</div>', '>V73</div>')
          s = s.replace('🗓️ Mon parcours', '')
          s = s.replace('🗓️ Les 91 jours', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate V73
        run: |
          grep -q '>V73</div>' index.html
          grep -q 'id="v73-dashboard-restore-header"' index.html
          grep -q 'Mon tableau de bord' index.html
          grep -q 'Analyse de mon évolution' index.html
          grep -q 'Mes dernières journées' index.html
          grep -q '💾 Sauvegarder' index.html
          ! grep -q '>V72</div>' index.html
          ! grep -q 'id="v72-dashboard-no-today-duplicates"' index.html
          test "$(grep -o '>V73</div>' index.html | wc -l)" -eq 1

      - name: Commit V73
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "V73 déjà présent"
            exit 0
          fi
          git commit -m "V73 - restore dashboard header without Today duplicates"
          git pull --rebase origin main
          git push origin HEAD:main
