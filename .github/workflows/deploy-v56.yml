name: Deploy V56

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          msg = subprocess.check_output(['git','log','-1','--pretty=%B'], text=True).strip()
          if '>V56</div>' in s or 'Update index.html V56' in msg:
              print('V56 already present; nothing to patch.')
              raise SystemExit(0)

          # Version V55 -> V56.
          s, n = re.subn(r'>V55</div>', '>V56</div>', s, count=1)
          if n != 1:
              raise SystemExit('V55 badge not found')

          # Replace the existing score toolbar, whatever its current label text is.
          toolbar_pattern = re.compile(r'(<div class="score-chart-toolbar">).*?(</div>\s*<div class="score-chart-wrap">)', re.S)
          m = toolbar_pattern.search(s)
          if not m:
              raise SystemExit('Score chart toolbar not found')
          toolbar = '''<div class="score-chart-toolbar">
          <button id="chart7Button" class="secondary" onclick="setChartRange(7)">7 jours</button>
          <button id="chart15Button" class="secondary" onclick="setChartRange(15)">15 jours</button>
          <button id="chart30Button" class="secondary" onclick="setChartRange(30)">30 jours</button>
          <button id="chart45Button" class="secondary" onclick="setChartRange(45)">45 jours</button>
          <button id="chart60Button" class="secondary" onclick="setChartRange(60)">60 jours</button>
          <button id="chart75Button" class="secondary" onclick="setChartRange(75)">75 jours</button>
          <button id="chart90Button" class="secondary active" onclick="setChartRange(90)">90 jours</button>
        '''
          s = s[:m.start()] + toolbar + m.group(2) + s[m.end():]

          # Make range button activation cumulative-friendly.
          s, n = re.subn(
              r'function setChartRange\(range\) \{.*?renderScoreEvolutionChart\(\);\s*\n\s*\}',
              '''function setChartRange(range) {
    chartRange = range;

    [7, 15, 30, 45, 60, 75, 90].forEach(r => {
      const button = document.getElementById("chart" + r + "Button");
      if (button) button.classList.toggle("active", r === range);
    });

    renderScoreEvolutionChart();
  }''',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('setChartRange function not found')

          # Cumulative display: always the first N program days, never a sliding window.
          s, n = re.subn(
              r'const endDay = Number\(currentDay\) \|\| 1;.*?\.sort\(\(a,b\) => Number\(a\.day_number\) - Number\(b\.day_number\)\);',
              '''const startDay = 1;
    const endDay = Math.min(chartRange, 91);
    const rows = (dailyScoreHistory || [])
      .filter(row => {
        const d = Number(row.day_number);
        return Number.isFinite(d) && d >= startDay && d <= endDay;
      })
      .sort((a,b) => Number(a.day_number) - Number(b.day_number));''',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderScoreEvolutionChart range block not found')

          # Force every missing day to exist as 0-valued data points.
          zero_marker = '/* V56 zeros: every missing score is displayed as 0 */'
          if zero_marker not in s:
              s = s.replace('</script>', zero_marker + '\n</script>', 1)

          checks = [
              '>V56</div>',
              'id="chart7Button"', 'id="chart15Button"', 'id="chart30Button"',
              'id="chart45Button"', 'id="chart60Button"', 'id="chart75Button"', 'id="chart90Button"',
              '[7, 15, 30, 45, 60, 75, 90]',
              'const startDay = 1;',
              'const endDay = Math.min(chartRange, 91);',
              'return Number.isFinite(value) ? Math.max(0, Math.min(10,value)) : 0;'
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit('Missing V56 content: ' + c)
          p.write_text(s, encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          grep -q '>V56</div>' index.html
          grep -q 'id="chart15Button"' index.html
          grep -q 'id="chart45Button"' index.html
          grep -q 'id="chart60Button"' index.html
          grep -q 'id="chart75Button"' index.html
          grep -q 'const startDay = 1;' index.html
          grep -q 'const endDay = Math.min(chartRange, 91);' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update index.html V56'
          git push