name: Deploy V60 stable

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V60
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          if '>V60</div>' not in s:
              if '>V59</div>' not in s: raise SystemExit('V59 badge not found')
              s=s.replace('>V59</div>','>V60</div>',1)

          marker='        <div id="chartStatus" class="empty hidden">Aucun score enregistré sur cette période — le graphique se remplira au fur et à mesure.</div>'
          summary='''        <div id="scoreEvolutionSummary" class="score-evolution-summary" aria-live="polite">
          <div class="score-summary-item"><span class="score-summary-label">Progression depuis J1</span><strong id="scoreSummaryProgression">—</strong></div>
          <div class="score-summary-item"><span class="score-summary-label">Dimension la plus forte</span><strong id="scoreSummaryStrongest">—</strong></div>
          <div class="score-summary-item"><span class="score-summary-label">Dimension à travailler</span><strong id="scoreSummaryWeakest">—</strong></div>
          <p id="scoreSummaryContext" class="score-summary-context">Les indicateurs portent sur la période affichée.</p>
        </div>'''
          if 'id="scoreEvolutionSummary"' not in s:
              if marker not in s: raise SystemExit('chart marker not found')
              s=s.replace(marker,marker+'\n'+summary,1)

          if 'id="v60-evolution-summary"' not in s:
              css='''<style id="v60-evolution-summary">
.score-evolution-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.score-summary-item{background:#f7f5f1;border:1px solid #ddd9d1;border-radius:10px;padding:12px;min-width:0}
.score-summary-label{display:block;color:#777;font-size:12px;margin-bottom:4px}
.score-summary-item strong{display:block;font-size:16px;line-height:1.3}
.score-summary-context{grid-column:1/-1;margin:0;color:#777;font-size:12px}
@media (max-width:700px){.score-evolution-summary{grid-template-columns:1fr}.score-summary-context{grid-column:auto}}
</style>\n'''
              s=s.replace('</head>',css+'</head>',1)

          if 'function renderScoreEvolutionSummary()' not in s:
              js='''
  function renderScoreEvolutionSummary() {
    const progressEl=document.getElementById("scoreSummaryProgression");
    const strongestEl=document.getElementById("scoreSummaryStrongest");
    const weakestEl=document.getElementById("scoreSummaryWeakest");
    const contextEl=document.getElementById("scoreSummaryContext");
    if(!progressEl||!strongestEl||!weakestEl)return;
    const endDay=Math.min(chartRange,91);
    const rows=(dailyScoreHistory||[]).filter(r=>{const d=Number(r.day_number);return Number.isFinite(d)&&d>=1&&d<=endDay}).sort((a,b)=>Number(a.day_number)-Number(b.day_number));
    const dims=[["presence","Présence"],["impulse_control","Maîtrise de l'impulsion"],["values_coherence","Cohérence avec mes valeurs"],["self_relation","Relation à moi-même"]];
    const valid=v=>{const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=10?n:null};
    const avg=r=>{const v=dims.map(([k])=>valid(r?.[k])).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const scored=rows.filter(r=>avg(r)!==null);
    if(!scored.length){progressEl.textContent="—";strongestEl.textContent="—";weakestEl.textContent="—";if(contextEl)contextEl.textContent="Aucun score enregistré sur la période affichée.";return}
    const delta=avg(scored[scored.length-1])-avg(scored[0]);
    progressEl.textContent=(delta>=0?"+":"")+delta.toFixed(1)+" point"+(Math.abs(delta)>=2?"s":"");
    const avgs=dims.map(([k,label])=>{const v=rows.map(r=>valid(r?.[k])).filter(x=>x!==null);return {label:label,average:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}).filter(x=>x.average!==null).sort((a,b)=>b.average-a.average);
    strongestEl.textContent=avgs[0]?avgs[0].label+" · "+avgs[0].average.toFixed(1)+"/10":"—";
    weakestEl.textContent=avgs.length?avgs[avgs.length-1].label+" · "+avgs[avgs.length-1].average.toFixed(1)+"/10":"—";
    if(contextEl)contextEl.textContent="Comparaison du premier score enregistré (J"+Number(scored[0].day_number)+") au dernier (J"+Number(scored[scored.length-1].day_number)+"). Les deux autres indicateurs sont calculés sur la période affichée.";
  }
'''
              insert='\n  /* ============================================================\n     FORMATAGE PROGRAMME'
              if insert not in s: raise SystemExit('insert marker not found')
              s=s.replace(insert,js+insert,1)

          if 'renderScoreEvolutionSummary();' not in s:
              end='    if (status) { status.textContent = ""; status.classList.add("hidden"); }\n  }\n\n  /* ============================================================\n     FORMATAGE PROGRAMME'
              if end not in s: raise SystemExit('chart end marker not found')
              s=s.replace(end,'    if (status) { status.textContent = ""; status.classList.add("hidden"); }\n    renderScoreEvolutionSummary();\n  }\n\n  /* ============================================================\n     FORMATAGE PROGRAMME',1)

          checks=['>V60</div>','id="scoreEvolutionSummary"','function renderScoreEvolutionSummary()','renderScoreEvolutionSummary();','function collectControlTable()','__CONTROL_TABLE_JSON__','__FIN_TABLEAU_CONTROLE__','const keys = [','const averageColor = "#f59e0b"','id="chart90Button"']
          for x in checks:
              if x not in s: raise SystemExit('Missing V60: '+x)
          if s.count('id="scoreEvolutionSummary"')!=1: raise SystemExit('summary count')
          if len(re.findall(r'function renderScoreEvolutionSummary\(\)',s))!=1: raise SystemExit('function count')
          p.write_text(s,encoding='utf-8')

      - name: Validate and commit
        run: |
          grep -q '>V60</div>' index.html
          grep -q 'id="scoreEvolutionSummary"' index.html
          grep -q 'function renderScoreEvolutionSummary()' index.html
          grep -q 'renderScoreEvolutionSummary();' index.html
          grep -q '__CONTROL_TABLE_JSON__' index.html
          grep -q '__FIN_TABLEAU_CONTROLE__' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update index.html V60'
          git push
